<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Asistente de Estudio</title>
<style>
  :root {
    --bg: #030608;
    --core: #4fd8ff;
    --core-dim: #1a6b85;
    --ring: #0d2b36;
    --text: #cdeffb;
    --text-dim: #5f8a96;
    --warn: #ff6b4a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(ellipse at center, #061014 0%, var(--bg) 70%);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text);
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: 100%; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  .core-wrap {
    position: relative;
    width: min(70vw, 340px);
    height: min(70vw, 340px);
  }

  svg.rings { position: absolute; inset: 0; width: 100%; height: 100%; }

  .ring { fill: none; stroke: var(--ring); stroke-width: 1.4; transition: stroke .25s ease; }
  .ring.active { stroke: var(--core-dim); }

  .tick { stroke: var(--ring); stroke-width: 1; }
  .tick.active { stroke: var(--core); }

  .core-glow {
    position: absolute;
    top: 50%; left: 50%;
    width: 34%; height: 34%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, var(--core) 0%, var(--core-dim) 55%, transparent 75%);
    box-shadow: 0 0 40px 6px rgba(79, 216, 255, 0.25);
    opacity: 0.45;
    transition: opacity .2s ease, box-shadow .2s ease, transform .2s ease;
  }
  .core-glow.listening { opacity: 0.65; }
  .core-glow.triggered {
    opacity: 1;
    box-shadow: 0 0 90px 20px rgba(79, 216, 255, 0.55);
    transform: translate(-50%, -50%) scale(1.12);
  }

  .bars {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .bars canvas { width: 100%; height: 100%; }

  .status {
    margin-top: 34px;
    text-align: center;
    letter-spacing: 0.12em;
    font-size: 13px;
    color: var(--text-dim);
    min-height: 20px;
  }
  .status b { color: var(--core); font-weight: 500; }

  .caption {
    margin-top: 10px;
    max-width: 420px;
    text-align: center;
    font-size: 16px;
    line-height: 1.5;
    color: var(--text);
    min-height: 48px;
    padding: 0 20px;
  }

  .materia-badge {
    margin-top: 6px;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--core-dim);
    min-height: 14px;
  }
  .materia-badge b { color: var(--core); }

  .startbtn {
    margin-top: 26px;
    padding: 10px 22px;
    background: transparent;
    border: 1px solid var(--core-dim);
    color: var(--core);
    border-radius: 4px;
    font-size: 13px;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all .2s ease;
  }
  .startbtn:hover { background: rgba(79,216,255,0.08); border-color: var(--core); }
  .startbtn:disabled { opacity: 0.3; cursor: default; }

  .meter {
    position: absolute;
    bottom: 26px; left: 50%;
    transform: translateX(-50%);
    width: min(80vw, 260px);
    height: 4px;
    background: var(--ring);
    border-radius: 2px;
    overflow: hidden;
  }
  .meter-fill {
    height: 100%; width: 0%;
    background: var(--core-dim);
    transition: width .05s linear;
  }

  .corner {
    position: absolute;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--text-dim);
  }
  .corner.tl { top: 18px; left: 18px; }
  .corner.tr { top: 18px; right: 18px; text-align: right; }

  .voicebar {
    margin-top: 18px;
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--text-dim);
  }
  .voicebar select {
    background: #061014;
    color: var(--text);
    border: 1px solid var(--ring);
    border-radius: 4px;
    padding: 5px 8px;
    font-size: 12px;
    max-width: 220px;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="corner tl">SISTEMA · ESCUCHA ACTIVA</div>
  <div class="corner tr" id="clockCorner">--:--:--</div>

  <div class="core-wrap">
    <svg class="rings" viewBox="0 0 200 200">
      <circle class="ring" id="ring1" cx="100" cy="100" r="92"/>
      <circle class="ring" id="ring2" cx="100" cy="100" r="74"/>
      <circle class="ring" id="ring3" cx="100" cy="100" r="58"/>
      <g id="ticks"></g>
    </svg>
    <div class="bars"><canvas id="waveCanvas" width="340" height="340"></canvas></div>
    <div class="core-glow" id="coreGlow"></div>
  </div>

  <div class="meter"><div class="meter-fill" id="meterFill"></div></div>

  <div class="status" id="status">Presiona <b>ACTIVAR SISTEMA</b> para iniciar</div>
  <div class="caption" id="caption"></div>
  <div class="materia-badge" id="materiaBadge"></div>
  <button class="startbtn" id="startBtn">ACTIVAR SISTEMA</button>

  <div class="voicebar">
    <label for="voiceSelect">Voz:</label>
    <select id="voiceSelect"></select>
  </div>
</div>

<script>
(function(){
  const startBtn = document.getElementById('startBtn');
  const statusEl = document.getElementById('status');
  const captionEl = document.getElementById('caption');
  const materiaBadge = document.getElementById('materiaBadge');
  const coreGlow = document.getElementById('coreGlow');
  const clockCorner = document.getElementById('clockCorner');

  function setClock(){
    clockCorner.textContent = new Date().toLocaleTimeString('es-PA', {hour12:false});
  }
  setClock();
  setInterval(setClock, 1000);

  let voz = null;
  const voiceSelect = document.getElementById('voiceSelect');
  const PISTAS_CALIDAD = ['google', 'natural', 'online', 'neural', 'microsoft'];

  function poblarVoces(){
    const voces = speechSynthesis.getVoices();
    if (!voces.length) return;
    const ordenadas = [...voces].sort((a, b) => {
      const aEs = a.lang && a.lang.startsWith('es') ? 1 : 0;
      const bEs = b.lang && b.lang.startsWith('es') ? 1 : 0;
      if (aEs !== bEs) return bEs - aEs;
      return 0;
    });
    voiceSelect.innerHTML = '';
    ordenadas.forEach((v) => {
      const opt = document.createElement('option');
      opt.value = v.name;
      opt.textContent = `${v.name} (${v.lang})`;
      voiceSelect.appendChild(opt);
    });
    voz = ordenadas.find(v => v.lang && v.lang.startsWith('es')) || ordenadas[0];
    if(voz) voiceSelect.value = voz.name;
  }

  voiceSelect.addEventListener('change', () => {
    const voces = speechSynthesis.getVoices();
    voz = voces.find(v => v.name === voiceSelect.value) || voz;
  });

  if ('speechSynthesis' in window) {
    speechSynthesis.onvoiceschanged = poblarVoces;
    poblarVoces();
  }

  function hablar(texto, alTerminar){
    captionEl.textContent = texto;
    if (!('speechSynthesis' in window)) { if (alTerminar) alTerminar(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    if (voz) u.voice = voz;
    u.lang = (voz && voz.lang) || 'es-ES';
    u.pitch = 1.0;
    u.rate = 1.0;
    u.onend = () => { if (alTerminar) alTerminar(); };
    speechSynthesis.speak(u);
  }

  function normalizar(s){
    return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
  }

  /* BANCO DE PREGUNTAS COMPLETO Y ESTRUCTURADO */
  const MATERIAS = {
    "cardiovascular": {
      "label": "Cardiovascular",
      "aliases": ["cardiovascular", "cardiaco", "cardiologia", "corazon"],
      "preguntas": [
        {"pregunta": "¿Qué tipos de potenciales de acción son característicos en las fibras musculares cardíacas?", "respuesta": "meseta"},
        {"pregunta": "¿Con qué otro nombre se conoce al haz de Bachmann?", "respuesta": "banda interauricular anterior"},
        {"pregunta": "¿De qué no depende el Batmotropismo?", "respuesta": "nodo sinusal"},
        {"pregunta": "¿Término que describe la capacidad del tejido cardíaco de generar sus propios estímulos?", "respuesta": "automatismo"},
        {"pregunta": "¿En dónde se sitúa el nodo sinusal dentro del corazón?", "respuesta": "auricula derecha"},
        {"pregunta": "En el ciclo cardíaco, ¿de cuánto es el volumen sistólico normal?", "respuesta": "70 ml"}
      ]
    },
    "respiratorio": {
      "label": "Respiratorio",
      "aliases": ["respiratorio", "pulmonar", "pulmones", "respiracion"],
      "preguntas": [
        {"pregunta": "¿En qué órganos se produce en mayor concentración la enzima convertidora de angiotensina?", "respuesta": "pulmones"},
        {"pregunta": "¿En el transporte de CO2, quién cataliza la reacción de CO2 con el agua?", "respuesta": "anhidrasa carbonica"},
        {"pregunta": "¿Cuál es la función principal del centro neumotáxico?", "respuesta": "limitar la inspiracion"}
      ]
    },
    "renal": {
      "label": "Renal",
      "aliases": ["renal", "rinon", "rinones"],
      "preguntas": [
        {"pregunta": "¿Dónde se reabsorbe la mayor cantidad de agua en la nefrona?", "respuesta": "tubulo proximal"},
        {"pregunta": "¿Qué hormona es sintetizada por las células yuxtaglomerulares ante baja presión?", "respuesta": "renina"}
      ]
    }
  };

  /* ESTADO DEL SISTEMA */
  let activo = false;
  let estadoEstudio = "INICIO"; // "ESPERANDO_MATERIA", "EN_EXAMEN"
  let materiaActual = null;
  let preguntaActual = null;
  let rec = null;

  // Reconocimiento de Voz
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (SpeechRecognition) {
    rec = new SpeechRecognition();
    rec.continuous = false;
    rec.interimResults = false;
    rec.lang = 'es-ES';

    rec.onstart = () => {
      coreGlow.classList.add('listening');
      statusEl.innerHTML = "<b>ESCUCHANDO...</b>";
    };

    rec.onend = () => {
      coreGlow.classList.remove('listening');
      if (activo && !speechSynthesis.speaking) {
        try { rec.start(); } catch(e){}
      }
    };

    rec.onresult = (e) => {
      const texto = e.results[0][0].transcript;
      console.log("Escuchado:", texto);
      procesarComando(texto);
    };
  }

  function procesarComando(transcripcion) {
    const txt = normalizar(transcripcion);

    // Apagado del Asistente
    if (txt.includes("apagate") || txt.includes("apagar") || txt.includes("desactivar")) {
      activo = false;
      estadoEstudio = "INICIO";
      rec.stop();
      hablar("Apagando sistemas, señor JP. Buena suerte en sus estudios.", () => {
        statusEl.innerHTML = "Presiona <b>ACTIVAR SISTEMA</b> para iniciar";
        materiaBadge.innerHTML = "";
      });
      return;
    }

    // Selección de Materia
    if (estadoEstudio === "ESPERANDO_MATERIA") {
      let seleccionada = null;
      for (let k in MATERIAS) {
        if (MATERIAS[k].aliases.some(alias => txt.includes(alias))) {
          seleccionada = k;
          break;
        }
      }

      if (seleccionada) {
        materiaActual = seleccionada;
        estadoEstudio = "EN_EXAMEN";
        materiaBadge.innerHTML = `MATERIA: <b>${MATERIAS[materiaActual].label.toUpperCase()}</b>`;
        hablar(`Excelente elección, señor JP. Iniciando banco de ${MATERIAS[materiaActual].label}.`, () => {
          siguientePregunta();
        });
      } else {
        hablar("No reconozco esa materia, señor JP. Por favor elija entre Cardiovascular, Respiratorio o Renal.");
      }
      return;
    }

    // Evaluación de Respuestas en Modo Examen
    if (estadoEstudio === "EN_EXAMEN" && preguntaActual) {
      // Opción: No sé
      if (txt.includes("no se") || txt.includes("ni idea") || txt.includes("paso")) {
        hablar(`La respuesta correcta era: ${preguntaActual.respuesta}. Pasemos a la siguiente, señor.`, () => {
          siguientePregunta();
        });
        return;
      }

      // Comprobación de Respuesta
      const respCorrecta = normalizar(preguntaActual.respuesta);
      const esCorrecto = txt.includes(respCorrecta) || respCorrecta.includes(txt);

      if (esCorrecto) {
        hablar("Correcto, señor JP. Buen trabajo. Vamos con la siguiente.", () => {
          siguientePregunta();
        });
      } else {
        hablar(`Decepcionante, señor. La respuesta correcta es ${preguntaActual.respuesta}. Siguiente pregunta.`, () => {
          siguientePregunta();
        });
      }
    }
  }

  function siguientePregunta() {
    if (!materiaActual) return;
    const banco = MATERIAS[materiaActual].preguntas;
    const idx = Math.floor(Math.random() * banco.length);
    preguntaActual = banco[idx];
    hablar(preguntaActual.pregunta);
  }

  startBtn.addEventListener('click', () => {
    if (!SpeechRecognition) {
      alert("Tu navegador no soporta reconocimiento de voz Web Speech API.");
      return;
    }
    activo = true;
    estadoEstudio = "ESPERANDO_MATERIA";
    startBtn.disabled = true;

    const saludo = "Buenas noches, señor JP. Sistemas en línea. ¿Qué materia desea estudiar hoy?";
    hablar(saludo, () => {
      try { rec.start(); } catch(e){}
    });
  });

})();
</script>
</body>
</html>
