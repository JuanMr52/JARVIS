<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Repaso de Estudio con Voces</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; }
    .controls { margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
    label { font-weight: bold; }
    select, button { padding: 8px; font-size: 14px; }
    .card { border: 1px solid #ccc; padding: 15px; border-radius: 8px; background: #f9f9f9; }
  </style>
</head>
<body>

  <h2>Lector de Preguntas</h2>

  <div class="controls">
    <label for="voiceSelect">Selecciona la voz:</label>
    <select id="voiceSelect"><option>Cargando voces...</option></select>
    
    <button onclick="hablar()">🔊 Leer pregunta</button>
  </div>

  <div class="card">
    <p id="pregunta">Un paciente presenta diarrea acuosa. En el microscopio observas oocistos de 4-5 µm. ¿Qué parásito es?</p>
  </div>

  <script>
    const synth = window.speechSynthesis;
    const voiceSelect = document.getElementById('voiceSelect');
    let voices = [];

    // Carga las voces disponibles en el navegador/sistema
    function cargarVoces() {
      voices = synth.getVoices().filter(voice => voice.lang.includes('es')); // Filtra por español
      voiceSelect.innerHTML = '';

      if (voices.length === 0) {
        const option = document.createElement('option');
        option.textContent = 'No se encontraron voces en español';
        voiceSelect.appendChild(option);
        return;
      }

      voices.forEach((voice, index) => {
        const option = document.createElement('option');
        option.textContent = `${voice.name} (${voice.lang})`;
        option.setAttribute('data-index', index);
        
        // Priorizar voces que contengan "Google", "Natural" o "Online" si existen
        if (voice.name.includes('Natural') || voice.name.includes('Google') || voice.name.includes('Microsoft')) {
          option.textContent += ' ⭐';
        }
        
        voiceSelect.appendChild(option);
      });
    }

    // Chrome y Edge requieren el evento 'onvoiceschanged' para cargar la lista
    cargarVoces();
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = cargarVoces;
    }

    function hablar() {
      if (synth.speaking) synth.cancel(); // Detener si ya estaba hablando

      const texto = document.getElementById('pregunta').innerText;
      const utterance = new SpeechSynthesisUtterance(texto);

      // Asignar la voz seleccionada
      const selectedIndex = voiceSelect.selectedOptions[0]?.getAttribute('data-index');
      if (selectedIndex !== null && voices[selectedIndex]) {
        utterance.voice = voices[selectedIndex];
      }

      // Ajustes opcionales para mayor naturalidad
      utterance.rate = 0.95; // Velocidad ligeramente reducida
      utterance.pitch = 1.0;  // Tono normal

      synth.speak(utterance);
    }
  </script>
</body>
</html>
