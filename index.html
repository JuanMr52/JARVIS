<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Asistente de Estudio Función Humana</title>
<style>
  :root {
    --bg: #030608;
    --core: #4fd8ff;
    --core-dim: #1a6b85;
    --ring: #0d2b36;
    --text: #cdeffb;
    --text-dim: #5f8a96;
    --warn: #ff6b4a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(ellipse at center, #061014 0%, var(--bg) 70%);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text);
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: 100%; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  .core-wrap {
    position: relative;
    width: min(70vw, 340px);
    height: min(70vw, 340px);
  }

  svg.rings { position: absolute; inset: 0; width: 100%; height: 100%; }

  .ring { fill: none; stroke: var(--ring); stroke-width: 1.4; transition: stroke .25s ease; }
  .ring.active { stroke: var(--core-dim); }

  .tick { stroke: var(--ring); stroke-width: 1; transition: stroke .15s ease; }
  .tick.active { stroke: var(--core); }

  .core-glow {
    position: absolute;
    top: 50%; left: 50%;
    width: 38%; height: 38%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, var(--core) 0%, var(--core-dim) 55%, transparent 75%);
    box-shadow: 0 0 45px 10px rgba(79, 216, 255, 0.25);
    opacity: 0.45;
    transition: opacity .2s ease, box-shadow .2s ease, transform .2s ease;
  }
  .core-glow.listening { opacity: 0.8; box-shadow: 0 0 65px 15px rgba(79, 216, 255, 0.45); }

  .bars {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .bars canvas { width: 100%; height: 100%; }

  .status {
    margin-top: 34px;
    text-align: center;
    letter-spacing: 0.12em;
    font-size: 13px;
    color: var(--text-dim);
    min-height: 20px;
  }
  .status b { color: var(--core); font-weight: 500; }

  .caption {
    margin-top: 10px;
    max-width: 550px;
    text-align: center;
    font-size: 15px;
    line-height: 1.5;
    color: var(--text);
    min-height: 48px;
    padding: 0 20px;
  }

  .materia-badge {
    margin-top: 6px;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--core-dim);
    min-height: 14px;
  }
  .materia-badge b { color: var(--core); }

  .startbtn {
    margin-top: 26px;
    padding: 10px 22px;
    background: transparent;
    border: 1px solid var(--core-dim);
    color: var(--core);
    border-radius: 4px;
    font-size: 13px;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all .2s ease;
  }
  .startbtn:hover { background: rgba(79,216,255,0.08); border-color: var(--core); }
  .startbtn:disabled { opacity: 0.3; cursor: default; }

  .meter {
    position: absolute;
    bottom: 26px; left: 50%;
    transform: translateX(-50%);
    width: min(80vw, 260px);
    height: 4px;
    background: var(--ring);
    border-radius: 2px;
    overflow: hidden;
  }
  .meter-fill {
    height: 100%; width: 0%;
    background: var(--core-dim);
    transition: width .05s linear;
  }

  .corner {
    position: absolute;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--text-dim);
  }
  .corner.tl { top: 18px; left: 18px; }
  .corner.tr { top: 18px; right: 18px; text-align: right; }

  .voicebar {
    margin-top: 18px;
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--text-dim);
  }
  .voicebar select {
    background: #061014;
    color: var(--text);
    border: 1px solid var(--ring);
    border-radius: 4px;
    padding: 5px 8px;
    font-size: 12px;
    max-width: 250px;
    outline: none;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="corner tl">SISTEMA · ESCUCHA FLEXIBLE INTELIGENTE</div>
  <div class="corner tr" id="clockCorner">--:--:--</div>

  <div class="core-wrap">
    <svg class="rings" viewBox="0 0 200 200">
      <circle class="ring" id="ring1" cx="100" cy="100" r="92"/>
      <circle class="ring" id="ring2" cx="100" cy="100" r="74"/>
      <circle class="ring" id="ring3" cx="100" cy="100" r="58"/>
      <g id="ticks"></g>
    </svg>
    <div class="bars"><canvas id="waveCanvas" width="340" height="340"></canvas></div>
    <div class="core-glow" id="coreGlow"></div>
  </div>

  <div class="meter"><div class="meter-fill" id="meterFill"></div></div>

  <div class="status" id="status">Presiona <b>ACTIVAR SISTEMA</b> para habilitar el micrófono</div>
  <div class="caption" id="caption"></div>
  <div class="materia-badge" id="materiaBadge"></div>
  <button class="startbtn" id="startBtn">ACTIVAR SISTEMA</button>

  <div class="voicebar">
    <label for="voiceSelect">Voz del Sistema:</label>
    <select id="voiceSelect"><option>Cargando voces...</option></select>
  </div>
</div>

<script>
(function(){
  const startBtn = document.getElementById('startBtn');
  const statusEl = document.getElementById('status');
  const captionEl = document.getElementById('caption');
  const materiaBadge = document.getElementById('materiaBadge');
  const coreGlow = document.getElementById('coreGlow');
  const meterFill = document.getElementById('meterFill');
  const clockCorner = document.getElementById('clockCorner');
  const canvas = document.getElementById('waveCanvas');
  const ctx = canvas.getContext('2d');
  const voiceSelect = document.getElementById('voiceSelect');

  function setClock(){
    clockCorner.textContent = new Date().toLocaleTimeString('es-PA', {hour12:false});
  }
  setClock();
  setInterval(setClock, 1000);

  const ticksGroup = document.getElementById('ticks');
  const TICK_COUNT = 48;
  const tickElements = [];
  for (let i = 0; i < TICK_COUNT; i++) {
    const angle = (i / TICK_COUNT) * Math.PI * 2;
    const r1 = 96, r2 = 100;
    const x1 = 100 + r1 * Math.cos(angle);
    const y1 = 100 + r1 * Math.sin(angle);
    const x2 = 100 + r2 * Math.cos(angle);
    const y2 = 100 + r2 * Math.sin(angle);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.classList.add('tick');
    ticksGroup.appendChild(line);
    tickElements.push(line);
  }

  let audioCtx, analyser, microphone, dataArray;

  function initAudioVisualizer() {
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      microphone = audioCtx.createMediaStreamSource(stream);
      microphone.connect(analyser);
      analyser.fftSize = 128;
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      drawVisualizer();
    }).catch(err => console.log("Audio visualizer error:", err));
  }

  function drawVisualizer() {
    requestAnimationFrame(drawVisualizer);
    if (!analyser) return;
    analyser.getByteFrequencyData(dataArray);

    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
    let average = sum / dataArray.length;

    meterFill.style.width = Math.min(100, (average / 110) * 100) + '%';

    if (average > 20) {
      coreGlow.classList.add('listening');
      tickElements.forEach((el) => {
        if (Math.random() < average / 80) el.classList.add('active');
        else el.classList.remove('active');
      });
    } else {
      coreGlow.classList.remove('listening');
      tickElements.forEach(el => el.classList.remove('active'));
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const baseRadius = 60;
    const totalBars = 36;

    for (let i = 0; i < totalBars; i++) {
      const angle = (i / totalBars) * Math.PI * 2;
      const dataIndex = Math.floor((i / totalBars) * (dataArray.length / 1.5));
      const value = dataArray[dataIndex] || 0;
      
      const barHeight = (value / 255) * 45;
      const xStart = centerX + Math.cos(angle) * (baseRadius);
      const yStart = centerY + Math.sin(angle) * (baseRadius);
      const xEnd = centerX + Math.cos(angle) * (baseRadius + barHeight);
      const yEnd = centerY + Math.sin(angle) * (baseRadius + barHeight);

      const gradient = ctx.createLinearGradient(xStart, yStart, xEnd, yEnd);
      gradient.addColorStop(0, 'rgba(79, 216, 255, 0.2)');
      gradient.addColorStop(0.8, 'rgba(79, 216, 255, 0.8)');
      gradient.addColorStop(1, '#ffffff');

      ctx.beginPath();
      ctx.moveTo(xStart, yStart);
      ctx.lineTo(xEnd, yEnd);
      ctx.strokeStyle = gradient;
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.stroke();

      if (barHeight > 5) {
        ctx.beginPath();
        ctx.arc(xEnd, yEnd, 1.5, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#4fd8ff';
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }
  }

  // --- MOTOR DE VOZ ---
  let vocesDisponibles = [];
  let vozSeleccionada = null;

  function cargarVoces() {
    if (!('speechSynthesis' in window)) return;
    vocesDisponibles = speechSynthesis.getVoices();
    voiceSelect.innerHTML = '';

    let vocesEs = vocesDisponibles.filter(v => v.lang.startsWith('es'));
    let lista = vocesEs.length > 0 ? vocesEs : vocesDisponibles;

    lista.forEach((v) => {
      const opt = document.createElement('option');
      opt.value = v.name;
      let tag = (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Online') || v.name.includes('Neural')) ? ' ⭐ (Natural)' : '';
      opt.textContent = `${v.name} [${v.lang}]${tag}`;
      voiceSelect.appendChild(opt);
    });

    let vozPreferida = lista.find(v => v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Jorge') || v.name.includes('Helena')) || lista[0];
    if (vozPreferida) {
      voiceSelect.value = vozPreferida.name;
      vozSeleccionada = vozPreferida;
    }
  }

  if ('speechSynthesis' in window) {
    speechSynthesis.onvoiceschanged = cargarVoces;
    cargarVoces();
  }

  voiceSelect.addEventListener('change', () => {
    const selectedName = voiceSelect.value;
    vozSeleccionada = vocesDisponibles.find(v => v.name === selectedName);
    if (speechSynthesis.speaking) speechSynthesis.cancel();
    hablar("Voz de sistema actualizada, señor JP.");
  });

  function hablar(texto, alTerminar){
    captionEl.textContent = texto;
    if (!('speechSynthesis' in window)) { if (alTerminar) alTerminar(); return; }
    
    if (rec && escuchando) {
      try { rec.stop(); } catch(e){}
    }

    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    
    if (vozSeleccionada) {
      u.voice = vozSeleccionada;
      u.lang = vozSeleccionada.lang;
    } else {
      u.lang = 'es-ES';
    }
    
    u.pitch = 1.0;
    u.rate = 0.98;
    
    u.onend = () => {
      if (escuchando) {
        try { rec.start(); } catch(e){}
      }
      if (alTerminar) alTerminar();
    };

    u.onerror = () => {
      if (escuchando) try { rec.start(); } catch(e){}
    };
    
    speechSynthesis.speak(u);
  }

  // LIMPIEZA SEMÁNTICA Y COMPARADOR INTELIGENTE
  const MULETILLAS = [
    "en el", "en la", "es en", "es el", "es la", "son los", "son las", "se encuentra en",
    "esta en", "pienso que es", "creo que es", "yo creo que", "seria el", "seria la",
    "el", "la", "los", "las", "un", "una", "unos", "unas", "de", "del", "que", "se"
  ];

  function normalizarTexto(s) {
    let t = s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w\s]/gi, ' ').trim();
    return t;
  }

  function extraerPalabrasClave(texto) {
    let limpio = normalizarTexto(texto);
    let palabras = limpio.split(/\s+/).filter(p => p.length > 2 && !MULETILLAS.includes(p));
    return palabras;
  }

  function evaluarRespuestaSemantica(respuestaUsuario, respuestaCorrecta) {
    const normUsuario = normalizarTexto(respuestaUsuario);
    const normCorrecta = normalizarTexto(respuestaCorrecta);

    // 1. Coincidencia exacta o directa
    if (normUsuario.includes(normCorrecta) || normCorrecta.includes(normUsuario)) {
      return true;
    }

    // 2. Coincidencia por Palabras Clave
    const palabrasUsuario = extraerPalabrasClave(respuestaUsuario);
    const palabrasCorrectas = extraerPalabrasClave(respuestaCorrecta);

    if (palabrasCorrectas.length === 0) {
      return normUsuario.includes(normCorrecta);
    }

    let coincidencias = 0;
    palabrasCorrectas.forEach(clave => {
      if (palabrasUsuario.some(u => u.includes(clave) || clave.includes(u))) {
        coincidencias++;
      }
    });

    // Si coincide el 60% o más de las palabras clave principales de la respuesta
    const porcentajeAcierto = coincidencias / palabrasCorrectas.length;
    return porcentajeAcierto >= 0.6;
  }

  // BANCO DE 215 PREGUNTAS COMPLETO
  const MATERIAS = {
    "cardiovascular": {
      "label": "Cardiovascular",
      "aliases": ["cardiovascular", "cardiaco", "cardiologia", "corazon"],
      "preguntas": [
        {"pregunta": "¿Qué tipos de potenciales de acción son característicos en las fibras musculares cardíacas?", "respuesta": "meseta"},

        {"pregunta": "Nombre las células encargadas de detectar cambios en la postura corporal por variaciones en la presión arterial.", "respuesta": "barorreceptores"},

        {"pregunta": "¿En qué período se presenta un aumento de la presión sistólica y una disminución de la presión ventricular?", "respuesta": "periodo de eyeccion"},
        {"pregunta": "¿En dónde se sitúa el nodo sinusal dentro del corazón?", "respuesta": "auricula derecha"},
        {"pregunta": "En el ciclo cardíaco, ¿de cuánto es el volumen sistólico normal?", "respuesta": "70 ml"},

    },

  let escuchando = false;
  let estadoEstudio = "INICIO";
  let materiaActual = null;
  let preguntaActual = null;
  let rec = null;
  let preguntasRestantes = [];

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (SpeechRecognition) {
    rec = new SpeechRecognition();
    rec.continuous = true;
    rec.interimResults = true;
    rec.lang = 'es-ES';

    rec.onresult = (e) => {
      let transcripcion = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        transcripcion += e.results[i][0].transcript;
      }
      if (e.results[e.results.length - 1].isFinal) {
        procesarComando(transcripcion);
      }
    };

    rec.onend = () => {
      if (escuchando && !speechSynthesis.speaking) {
        try { rec.start(); } catch(e){}
      }
    };
  }

  function procesarComando(transcripcion) {
    const txt = normalizarTexto(transcripcion);
    statusEl.innerHTML = `Escuchado: "<b>${transcripcion}</b>"`;

    if (txt.includes("apagate") || txt.includes("apagar") || txt.includes("desactivar")) {
      escuchando = false;
      estadoEstudio = "INICIO";
      rec.stop();
      hablar("Apagando sistemas, señor JP. Mucho éxito en su examen.", () => {
        statusEl.innerHTML = "Presiona <b>ACTIVAR SISTEMA</b> para habilitar el micrófono";
        materiaBadge.innerHTML = "";
        captionEl.textContent = "";
      });
      return;
    }

    if (estadoEstudio === "ESPERANDO_MATERIA") {
      let seleccionada = null;
      for (let k in MATERIAS) {
        if (MATERIAS[k].aliases.some(alias => txt.includes(alias))) {
          seleccionada = k;
          break;
        }
      }

      if (seleccionada) {
        materiaActual = seleccionada;
        preguntasRestantes = [...MATERIAS[materiaActual].preguntas];
        estadoEstudio = "EN_EXAMEN";
        materiaBadge.innerHTML = `MATERIA ACTIVA: <b>${MATERIAS[materiaActual].label.toUpperCase()}</b> (${preguntasRestantes.length} PREGUNTAS DISPONIBLES)`;
        hablar(`Iniciando banco de ${MATERIAS[materiaActual].label}, señor JP.`, () => {
          siguientePregunta();
        });
      } else {
        hablar("Por favor elija una materia: Cardiovascular, Respiratorio, Renal, Digestivo o Endocrino.");
      }
      return;
    }

    if (estadoEstudio === "EN_EXAMEN" && preguntaActual) {
      if (txt.includes("cambiar materia") || txt.includes("otra materia")) {
        estadoEstudio = "ESPERANDO_MATERIA";
        hablar("Entendido, señor JP. ¿Qué otra materia desea repasar?");
        return;
      }

      if (txt.includes("no se") || txt.includes("ni idea") || txt.includes("paso") || txt.includes("siguiente")) {
        hablar(`La respuesta es ${preguntaActual.respuesta}. Siguiente pregunta.`, () => {
          siguientePregunta();
        });
        return;
      }

      // EVALUACIÓN FLEXIBLE E INTELIGENTE
      const acierto = evaluarRespuestaSemantica(transcripcion, preguntaActual.respuesta);

      if (acierto) {
        hablar("Correcto, señor JP. Muy bien.", () => {
          siguientePregunta();
        });
      } else {
        hablar(`Incorrecto. La respuesta clave es: ${preguntaActual.respuesta}. Continuemos.`, () => {
          siguientePregunta();
        });
      }
    }
  }

  function siguientePregunta() {
    if (!materiaActual) return;
    
    if (preguntasRestantes.length === 0) {
      preguntasRestantes = [...MATERIAS[materiaActual].preguntas];
      hablar(`Ha completado todas las preguntas de ${MATERIAS[materiaActual].label}. Reiniciando el banco.`, () => {
        siguientePregunta();
      });
      return;
    }

    const idx = Math.floor(Math.random() * preguntasRestantes.length);
    preguntaActual = preguntasRestantes[idx];
    preguntasRestantes.splice(idx, 1); // Evitar repetir inmediatamente

    materiaBadge.innerHTML = `MATERIA ACTIVA: <b>${MATERIAS[materiaActual].label.toUpperCase()}</b> (RESTANTES: ${preguntasRestantes.length + 1})`;
    hablar(preguntaActual.pregunta);
  }

  startBtn.addEventListener('click', () => {
    initAudioVisualizer();
    escuchando = true;
    estadoEstudio = "ESPERANDO_MATERIA";
    startBtn.disabled = true;

    const saludo = "Sistemas JARVIS en línea, señor JP. Indíqueme la materia a evaluar: Cardiovascular, Respiratorio, Renal, Digestivo o Endocrino.";
