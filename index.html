<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Asistente de Estudio</title>
<style>
  :root {
    --bg: #030608;
    --core: #4fd8ff;
    --core-dim: #1a6b85;
    --ring: #0d2b36;
    --text: #cdeffb;
    --text-dim: #5f8a96;
    --warn: #ff6b4a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(ellipse at center, #061014 0%, var(--bg) 70%);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text);
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: 100%; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  .core-wrap {
    position: relative;
    width: min(70vw, 340px);
    height: min(70vw, 340px);
  }

  svg.rings { position: absolute; inset: 0; width: 100%; height: 100%; }

  .ring { fill: none; stroke: var(--ring); stroke-width: 1.4; transition: stroke .25s ease; }
  .ring.active { stroke: var(--core-dim); }

  .tick { stroke: var(--ring); stroke-width: 1; }
  .tick.active { stroke: var(--core); }

  .core-glow {
    position: absolute;
    top: 50%; left: 50%;
    width: 34%; height: 34%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, var(--core) 0%, var(--core-dim) 55%, transparent 75%);
    box-shadow: 0 0 40px 6px rgba(79, 216, 255, 0.25);
    opacity: 0.45;
    transition: opacity .2s ease, box-shadow .2s ease, transform .2s ease;
  }
  .core-glow.listening { opacity: 0.65; }
  .core-glow.triggered {
    opacity: 1;
    box-shadow: 0 0 90px 20px rgba(79, 216, 255, 0.55);
    transform: translate(-50%, -50%) scale(1.12);
  }

  .bars {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .bars canvas { width: 100%; height: 100%; }

  .status {
    margin-top: 34px;
    text-align: center;
    letter-spacing: 0.12em;
    font-size: 13px;
    color: var(--text-dim);
    min-height: 20px;
  }
  .status b { color: var(--core); font-weight: 500; }

  .caption {
    margin-top: 10px;
    max-width: 420px;
    text-align: center;
    font-size: 16px;
    line-height: 1.5;
    color: var(--text);
    min-height: 48px;
    padding: 0 20px;
  }

  .materia-badge {
    margin-top: 6px;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--core-dim);
    min-height: 14px;
  }
  .materia-badge b { color: var(--core); }

  .startbtn {
    margin-top: 26px;
    padding: 10px 22px;
    background: transparent;
    border: 1px solid var(--core-dim);
    color: var(--core);
    border-radius: 4px;
    font-size: 13px;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all .2s ease;
  }
  .startbtn:hover { background: rgba(79,216,255,0.08); border-color: var(--core); }
  .startbtn:disabled { opacity: 0.3; cursor: default; }

  .meter {
    position: absolute;
    bottom: 26px; left: 50%;
    transform: translateX(-50%);
    width: min(80vw, 260px);
    height: 4px;
    background: var(--ring);
    border-radius: 2px;
    overflow: hidden;
  }
  .meter-fill {
    height: 100%; width: 0%;
    background: var(--core-dim);
    transition: width .05s linear;
  }
  .meter-fill.hot { background: var(--warn); }

  .corner {
    position: absolute;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--text-dim);
  }
  .corner.tl { top: 18px; left: 18px; }
  .corner.tr { top: 18px; right: 18px; text-align: right; }

  .voicebar {
    margin-top: 18px;
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--text-dim);
  }
  .voicebar select {
    background: #061014;
    color: var(--text);
    border: 1px solid var(--ring);
    border-radius: 4px;
    padding: 5px 8px;
    font-size: 12px;
    max-width: 220px;
  }
  .voicebar select:focus { outline: 1px solid var(--core-dim); }

  .listen-indicator {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .listen-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--warn);
    box-shadow: 0 0 8px 2px rgba(255,107,74,0.6);
    animation: pulse 1s infinite ease-in-out;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  /* --- Panel de materias (banco libre por palabra clave, opcional) --- */
  .panel-toggle {
    position: absolute;
    bottom: 18px; right: 18px;
    background: transparent;
    border: 1px solid var(--ring);
    color: var(--text-dim);
    border-radius: 4px;
    padding: 8px 12px;
    font-size: 11px;
    letter-spacing: 0.06em;
    cursor: pointer;
  }
  .panel-toggle:hover { border-color: var(--core-dim); color: var(--text); }

  .panel-overlay {
    position: fixed; inset: 0;
    background: rgba(2,6,8,0.88);
    display: none;
    align-items: center; justify-content: center;
    z-index: 20;
    padding: 24px;
  }
  .panel-overlay.open { display: flex; }

  .panel-box {
    width: min(560px, 100%);
    max-height: 84vh;
    overflow-y: auto;
    background: #061014;
    border: 1px solid var(--ring);
    border-radius: 8px;
    padding: 22px 24px;
  }
  .panel-box h2 {
    margin: 0 0 4px;
    font-size: 15px;
    letter-spacing: 0.08em;
    color: var(--core);
    font-weight: 500;
  }
  .panel-box p.hint {
    margin: 0 0 16px;
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.5;
  }
  .campo { margin-bottom: 12px; }
  .campo label {
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 4px;
    letter-spacing: 0.04em;
  }
  .campo input, .campo select, .campo textarea {
    width: 100%;
    background: #030608;
    color: var(--text);
    border: 1px solid var(--ring);
    border-radius: 4px;
    padding: 8px 9px;
    font-size: 13px;
    font-family: inherit;
    resize: vertical;
  }
  .campo textarea { min-height: 54px; }
  .panel-actions { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .panel-actions button {
    background: transparent;
    border: 1px solid var(--core-dim);
    color: var(--core);
    border-radius: 4px;
    padding: 8px 14px;
    font-size: 12px;
    cursor: pointer;
  }
  .panel-actions button:hover { background: rgba(79,216,255,0.08); }
  .panel-actions button.secundario {
    border-color: var(--ring); color: var(--text-dim);
  }
  .panel-actions input[type=file] { display: none; }

  .lista-conocimiento {
    margin-top: 20px;
    border-top: 1px solid var(--ring);
    padding-top: 14px;
  }
  .item-conocimiento {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(13,43,54,0.6);
    font-size: 12.5px;
  }
  .item-conocimiento .txt { flex: 1; }
  .item-conocimiento .materia-tag {
    color: var(--core);
    font-size: 10.5px;
    letter-spacing: 0.05em;
  }
  .item-conocimiento .pregunta { color: var(--text); margin: 2px 0; }
  .item-conocimiento .respuesta { color: var(--text-dim); }
  .item-conocimiento button {
    background: none; border: none;
    color: var(--warn);
    cursor: pointer;
    font-size: 12px;
    height: fit-content;
  }
  .cerrar-panel {
    float: right;
    background: none; border: none;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="corner tl">SISTEMA · ESCUCHA ACTIVA</div>
  <div class="corner tr" id="clockCorner">--:--:--</div>

  <div class="core-wrap">
    <svg class="rings" viewBox="0 0 200 200">
      <circle class="ring" id="ring1" cx="100" cy="100" r="92"/>
      <circle class="ring" id="ring2" cx="100" cy="100" r="74"/>
      <circle class="ring" id="ring3" cx="100" cy="100" r="58"/>
      <g id="ticks"></g>
    </svg>
    <div class="bars"><canvas id="waveCanvas" width="340" height="340"></canvas></div>
    <div class="core-glow" id="coreGlow"></div>
  </div>

  <div class="meter"><div class="meter-fill" id="meterFill"></div></div>

  <div class="status" id="status">Presiona <b>ACTIVAR</b> para habilitar el micrófono</div>
  <div class="caption" id="caption"></div>
  <div class="materia-badge" id="materiaBadge"></div>
  <button class="startbtn" id="startBtn">ACTIVAR SISTEMA</button>

  <div class="voicebar">
    <label for="voiceSelect">Voz</label>
    <select id="voiceSelect"></select>
  </div>
</div>

<button class="panel-toggle" id="panelToggle">📚 CONOCIMIENTO LIBRE</button>

<div class="panel-overlay" id="panelOverlay">
  <div class="panel-box">
    <button class="cerrar-panel" id="cerrarPanel">✕</button>
    <h2>CONOCIMIENTO POR PALABRA CLAVE (OPCIONAL)</h2>
    <p class="hint">Este panel es independiente del banco de preguntas por materia. Sirve para respuestas rápidas por palabra clave suelta, sin flujo de examen.</p>

    <div class="campo">
      <label for="fMateria">Materia</label>
      <select id="fMateria">
        <option>Fisiología</option>
        <option>Parasitología</option>
        <option>Citología / Histología</option>
        <option>Psicología</option>
        <option>Epidemiología</option>
        <option>Química</option>
        <option>General</option>
      </select>
    </div>
    <div class="campo">
      <label for="fClaves">Palabras clave (separadas por coma)</label>
      <input type="text" id="fClaves" placeholder="ej: nefrona, filtración glomerular">
    </div>
    <div class="campo">
      <label for="fPregunta">Pregunta (referencia, opcional)</label>
      <input type="text" id="fPregunta" placeholder="ej: ¿Qué es la nefrona?">
    </div>
    <div class="campo">
      <label for="fRespuesta">Respuesta que dirá en voz alta</label>
      <textarea id="fRespuesta" placeholder="ej: La nefrona es la unidad funcional del riñón..."></textarea>
    </div>

    <div class="panel-actions">
      <button id="agregarBtn">+ Agregar</button>
      <button class="secundario" id="exportarBtn">⬇ Exportar JSON</button>
      <button class="secundario" id="importarBtn">⬆ Importar JSON</button>
      <input type="file" id="importarInput" accept="application/json">
    </div>

    <div class="lista-conocimiento" id="listaConocimiento"></div>
  </div>
</div>

<script>
(function(){
  const startBtn = document.getElementById('startBtn');
  const statusEl = document.getElementById('status');
  const captionEl = document.getElementById('caption');
  const materiaBadge = document.getElementById('materiaBadge');
  const coreGlow = document.getElementById('coreGlow');
  const meterFill = document.getElementById('meterFill');
  const clockCorner = document.getElementById('clockCorner');
  const canvas = document.getElementById('waveCanvas');
  const ctx = canvas.getContext('2d');

  // Ticks decorativos alrededor del anillo exterior
  const ticksGroup = document.getElementById('ticks');
  const TICK_COUNT = 48;
  for (let i = 0; i < TICK_COUNT; i++) {
    const angle = (i / TICK_COUNT) * Math.PI * 2;
    const r1 = 96, r2 = 100;
    const x1 = 100 + r1 * Math.cos(angle);
    const y1 = 100 + r1 * Math.sin(angle);
    const x2 = 100 + r2 * Math.cos(angle);
    const y2 = 100 + r2 * Math.sin(angle);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.classList.add('tick');
    line.dataset.idx = i;
    ticksGroup.appendChild(line);
  }

  function setClock(){
    clockCorner.textContent = new Date().toLocaleTimeString('es-PA', {hour12:false});
  }
  setClock();
  setInterval(setClock, 1000);

  let voz = null;
  const voiceSelect = document.getElementById('voiceSelect');
  const PISTAS_CALIDAD = ['google', 'natural', 'online', 'neural', 'microsoft'];

  function poblarVoces(){
    const voces = speechSynthesis.getVoices();
    if (!voces.length) return;
    const ordenadas = [...voces].sort((a, b) => {
      const aEs = a.lang && a.lang.startsWith('es') ? 1 : 0;
      const bEs = b.lang && b.lang.startsWith('es') ? 1 : 0;
      if (aEs !== bEs) return bEs - aEs;
      const aCal = PISTAS_CALIDAD.some(p => a.name.toLowerCase().includes(p)) ? 1 : 0;
      const bCal = PISTAS_CALIDAD.some(p => b.name.toLowerCase().includes(p)) ? 1 : 0;
      return bCal - aCal;
    });
    voiceSelect.innerHTML = '';
    ordenadas.forEach((v) => {
      const opt = document.createElement('option');
      opt.value = v.name;
      opt.textContent = `${v.name} (${v.lang})`;
      voiceSelect.appendChild(opt);
    });
    const mejor = ordenadas.find(v => v.lang && v.lang.startsWith('es') &&
      PISTAS_CALIDAD.some(p => v.name.toLowerCase().includes(p))) || ordenadas[0];
    voz = mejor;
    voiceSelect.value = mejor.name;
  }

  voiceSelect.addEventListener('change', () => {
    const voces = speechSynthesis.getVoices();
    voz = voces.find(v => v.name === voiceSelect.value) || voz;
  });

  if ('speechSynthesis' in window) {
    speechSynthesis.onvoiceschanged = poblarVoces;
    poblarVoces();
  }

  function hablar(texto, alTerminar){
    captionEl.textContent = texto;
    if (!('speechSynthesis' in window)) { if (alTerminar) alTerminar(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    if (voz) u.voice = voz;
    u.lang = (voz && voz.lang) || 'es-ES';
    u.pitch = 1.0;
    u.rate = 1.0;
    if (alTerminar) u.onend = alTerminar;
    speechSynthesis.speak(u);
  }

  function normalizar(s){
    return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
  }

  /* =========================================================
     BANCO DE PREGUNTAS POR MATERIA (modo examen / quiz)
     ========================================================= */
  const MATERIAS = {"cardiovascular": {"label": "Cardiovascular", "aliases": ["cardiovascular", "cardiaco", "cardiología", "el corazon", "el corazón"], "preguntas": [{"pregunta": "¿Qué tipos de potenciales de acción son característicos en las fibras musculares cardíacas?", "respuesta": "Meseta"}, {"pregunta": "¿Con que otro nombre se conoce al haz de Bachman?", "respuesta": "Banda interauricular anterior"}, {"pregunta": "¿De qué no depende el Batmotropismo?", "respuesta": "Del nodo sinusal"}, {"pregunta": "Termino que se emplea para describir a la capacidad que tiene un tejido de generar sus propios estímulos. Automatismo", "respuesta": "Automatismo"}, {"pregunta": "¿Con qué fibras se comparan a las fibras internodulares?", "respuesta": "Purkinje"}, {"pregunta": "¿Cuál se considera el primer evento del ciclo cardíaco?", "respuesta": "Diástole auricular"}, {"pregunta": "¿Qué fase al finalizar me indica el final de la sístole ventricular?", "respuesta": "Eyección lenta"}, {"pregunta": "¿Cómo se denomina al volumen total de sangre presente en el ventrículo al final de la diástole?", "respuesta": "Diastólico final/Telediastólico/Precarga"}, {"pregunta": "Nombre las células encargadas de detectar un cambio en la postura del cuerpo por variaciones en la presión arterial.", "respuesta": "Barorreceptores"}, {"pregunta": "Termino que hace referencia a la capacidad que el ventrículo tiene de expandirse y llenarse durante la diástole.", "respuesta": "Distensibilidad"}, {"pregunta": "¿En qué período se presenta un aumento de la presión sistólica y una disminución de la presión ventricular?", "respuesta": "Período de eyección"}, {"pregunta": "¿En dónde se sitúa el nodo sinusal dentro del corazón?", "respuesta": "Aurícula derecha"}, {"pregunta": "En el ciclo cardíaco ¿De cuánto es el volumen sistólico?", "respuesta": "Aproximadamente 70 ml"}, {"pregunta": "¿Cuál es considerada la primera fase del ciclo cardíaco?", "respuesta": "Diástole auricular"}, {"pregunta": "¿Con qué otro nombre se conoce a la protodiástole?", "respuesta": "Eyección lenta"}, {"pregunta": "Válvulas se abren en la fase de eyección ventricular rápida.", "respuesta": "Semilunares/Pulmonar-aórtica"}, {"pregunta": "Período donde disminuye rápidamente las presiones intraventriculares y regresan a sus bajos valores diastólicos.", "respuesta": "Relajación isovolumétrica"}, {"pregunta": "Tipo de flujo sanguíneo en el cual se puede apreciar erosión de las paredes internas del vaso.", "respuesta": "Flujo turbulento"}, {"pregunta": "¿Qué sucede con la resistencia vascular periférica de un vaso sanguíneo cuando este último se dilata?", "respuesta": "Disminuye"}, {"pregunta": "Término que describe la propiedad del músculo cardíaco de generar sus propios estímulos.", "respuesta": "Automatismo"}, {"pregunta": "¿Cuál es la principal causa del flujo sanguíneo turbulento que ocurre en los vasos?", "respuesta": "Erosión"}, {"pregunta": "¿Qué representa el intervalo P-R del electrocardiograma?", "respuesta": "Inicio de la excitación eléctrica auricular y el inicio de la excitación eléctrica ventricular."}, {"pregunta": "En el electrocardiograma ¿Qué me representa la onda T?", "respuesta": "La repolarización de los ventrículos."}, {"pregunta": "¿Qué ocurre en la fase 0 del potencial de acción cardíaco?", "respuesta": "Se abren los canales de sodio y calcio."}, {"pregunta": "¿En qué células cardíacas encontramos mayor automaticidad?", "respuesta": "Células P."}, {"pregunta": "¿Cuál o cuáles válvulas se encuentran abiertas durante la sístole auricular derecha?", "respuesta": "La válvula bicúspide y tricúspide."}, {"pregunta": "¿Qué debe ocurrir para que las válvulas semilunares se abran en el ciclo cardíaco?", "respuesta": "La presión ventricular debe superar a la presión de la aorta y arteria pulmonar."}, {"pregunta": "¿Qué ocurre en la fase lenta de la eyección ventricular?", "respuesta": "La presión ventricular desciende."}, {"pregunta": "¿Cuál de las siguientes estructuras producirá en el e: Parathormona", "respuesta": "Libera calcio de los huesos."}, {"pregunta": "Relacione: Calcitonina", "respuesta": "Reduce concentración de Calcio extracelular."}, {"pregunta": "Relacione: Parathormona", "respuesta": "Aumenta absorción de calcio intestinal."}, {"pregunta": "Relacione: Corticótropas", "respuesta": "Estimula la generación de andrógenos."}, {"pregunta": "Relacione: Tirótropas", "respuesta": "Estimula la producción de hormonas tiroideas."}, {"pregunta": "Relacione: Gonadótropas", "respuesta": "Regula la espermatogenia testicular."}, {"pregunta": "Relacione: Calcitonina", "respuesta": "Reduce la concentración de calcio extracelular."}]}, "fisiologia": {"label": "Fisiología", "aliases": ["fisiologia", "fisiología"], "preguntas": [{"pregunta": "¿Qué tipos de potenciales de acción son característicos en las fibras musculares cardíacas?", "respuesta": "Meseta"}, {"pregunta": "¿Con que otro nombre se conoce al haz de Bachman?", "respuesta": "Banda interauricular anterior"}, {"pregunta": "¿De qué no depende el Batmotropismo?", "respuesta": "Del nodo sinusal"}, {"pregunta": "Termino que se emplea para describir a la capacidad que tiene un tejido de generar sus propios estímulos. Automatismo", "respuesta": "Automatismo"}, {"pregunta": "¿Con qué fibras se comparan a las fibras internodulares?", "respuesta": "Purkinje"}, {"pregunta": "¿Cuál se considera el primer evento del ciclo cardíaco?", "respuesta": "Diástole auricular"}, {"pregunta": "¿Qué fase al finalizar me indica el final de la sístole ventricular?", "respuesta": "Eyección lenta"}, {"pregunta": "¿Cómo se denomina al volumen total de sangre presente en el ventrículo al final de la diástole?", "respuesta": "Diastólico final/Telediastólico/Precarga"}, {"pregunta": "Nombre las células encargadas de detectar un cambio en la postura del cuerpo por variaciones en la presión arterial.", "respuesta": "Barorreceptores"}, {"pregunta": "Termino que hace referencia a la capacidad que el ventrículo tiene de expandirse y llenarse durante la diástole.", "respuesta": "Distensibilidad"}, {"pregunta": "¿En qué período se presenta un aumento de la presión sistólica y una disminución de la presión ventricular?", "respuesta": "Período de eyección"}, {"pregunta": "¿En dónde se sitúa el nodo sinusal dentro del corazón?", "respuesta": "Aurícula derecha"}, {"pregunta": "En el ciclo cardíaco ¿De cuánto es el volumen sistólico?", "respuesta": "Aproximadamente 70 ml"}, {"pregunta": "¿Cuál es considerada la primera fase del ciclo cardíaco?", "respuesta": "Diástole auricular"}, {"pregunta": "¿Con qué otro nombre se conoce a la protodiástole?", "respuesta": "Eyección lenta"}, {"pregunta": "Válvulas se abren en la fase de eyección ventricular rápida.", "respuesta": "Semilunares/Pulmonar-aórtica"}, {"pregunta": "Período donde disminuye rápidamente las presiones intraventriculares y regresan a sus bajos valores diastólicos.", "respuesta": "Relajación isovolumétrica"}, {"pregunta": "Tipo de flujo sanguíneo en el cual se puede apreciar erosión de las paredes internas del vaso.", "respuesta": "Flujo turbulento"}, {"pregunta": "¿Qué sucede con la resistencia vascular periférica de un vaso sanguíneo cuando este último se dilata?", "respuesta": "Disminuye"}, {"pregunta": "Término que describe la propiedad del músculo cardíaco de generar sus propios estímulos.", "respuesta": "Automatismo"}, {"pregunta": "¿Cuál es la principal causa del flujo sanguíneo turbulento que ocurre en los vasos?", "respuesta": "Erosión"}, {"pregunta": "¿Qué representa el intervalo P-R del electrocardiograma?", "respuesta": "Inicio de la excitación eléctrica auricular y el inicio de la excitación eléctrica ventricular."}, {"pregunta": "En el electrocardiograma ¿Qué me representa la onda T?", "respuesta": "La repolarización de los ventrículos."}, {"pregunta": "¿Qué ocurre en la fase 0 del potencial de acción cardíaco?", "respuesta": "Se abren los canales de sodio y calcio."}, {"pregunta": "¿En qué células cardíacas encontramos mayor automaticidad?", "respuesta": "Células P."}, {"pregunta": "¿Cuál o cuáles válvulas se encuentran abiertas durante la sístole auricular derecha?", "respuesta": "La válvula bicúspide y tricúspide."}, {"pregunta": "¿Qué debe ocurrir para que las válvulas semilunares se abran en el ciclo cardíaco?", "respuesta": "La presión ventricular debe superar a la presión de la aorta y arteria pulmonar."}, {"pregunta": "¿Qué ocurre en la fase lenta de la eyección ventricular?", "respuesta": "La presión ventricular desciende."}, {"pregunta": "¿Cuál de las siguientes estructuras producirá en el corazón la contracción auricular?", "respuesta": "Haz internodular."}, {"pregunta": "¿Cuál de las siguientes afirmaciones sobre el músculo cardíaco es la más exacta?.", "respuesta": "La contracción depende de la cantidad de calcio que rodea a los miocitos cardíacos."}, {"pregunta": "¿Qué sucede al final de la relajación isovolumétrica ventricular?.", "respuesta": "La válvula mitral se abre."}, {"pregunta": "¿Qué provoca, normalmente, la estimulación simpática del corazón?.", "respuesta": "Aumento de la fuerza de contracción de los ventrículos."}, {"pregunta": "¿Cuánto es el valor aproximado del llenado ventricular que es realizado por la contracción auricular?", "respuesta": "Aproximadamente 20%."}, {"pregunta": "¿Qué caracteriza a la capacitancia?", "respuesta": "Inversamente proporcional a la elastancia."}, {"pregunta": "¿Cuál de los siguientes efectos no aumenta la presión arterial?", "respuesta": "Ninguna de las respuestas es correcta."}, {"pregunta": "¿En cuánto tiempo retrasa el impulso el nodo atrioventricular?", "respuesta": "Aproximadamente 0,12 segundos."}, {"pregunta": "¿En la diástole auricular, cual es el porcentaje aproximado de sangre que fluye directamente de las venas a los ventrículos?", "respuesta": "Aproximadamente un 80%."}, {"pregunta": "¿Qué sucede durante la sístole ventricular?", "respuesta": "Las válvulas cúspides se cierran."}, {"pregunta": "¿Cuál de las siguientes ondas o complejos del electrocardiograma representa la repolarización ventricular y su relajación?", "respuesta": "Onda T."}, {"pregunta": "¿Cuál de las siguientes válvulas cardíacas permanece cerrada mientras el ventrículo izquierdo se encuentra en diástole?", "respuesta": "Válvula aórtica."}, {"pregunta": "Con respecto al estudio del corazón (electrofisiología cardiaca), ¿Cuál de las siguientes ondas representa la despolarización de los ventrículos?.", "respuesta": "Complejo QRS."}, {"pregunta": "¿Cuál de los siguientes enunciados corresponde al ciclo cardíaco?", "respuesta": "La frecuencia cardíaca es inversamente proporcional al tiempo del ciclo cardíaco."}, {"pregunta": "¿Cuál de los siguientes enunciados es incorrecto respecto a los músculos papilares?", "respuesta": "Contribuyen al cierre de las válvulas."}, {"pregunta": "¿Qué enunciado caracteriza a la precarga?", "respuesta": "Es la presión telediastólico."}, {"pregunta": "¿Qué iones provocan la autoexcitación del nodo sinusal?", "respuesta": "El calcio y el sodio."}, {"pregunta": "¿De qué no depende el Batmotropismo?", "respuesta": "Del nodo sinusal."}, {"pregunta": "¿En qué periodo del ciclo cardíaco se produce aumento de la tensión en el músculo cardíaco, pero no produce el vaciado de la cavidad?", "respuesta": "Período de contracción isovolumétrica."}, {"pregunta": "¿Cuál de los siguientes enunciados no corresponde al período de eyección en el ciclo cardíaco?", "respuesta": "Válvula aortica se cierra."}, {"pregunta": "Además de los nervios simpáticos, angiotensina II y vasopresina, el flujo sanguíneo en condiciones fisiológicas está determinado por necesidades:", "respuesta": "Metabólicas."}, {"pregunta": "¿En qué parte del E.C.G. podemos apreciar la repolarización de las aurículas?", "respuesta": "En ninguna de las opciones escritas."}, {"pregunta": "¿Cuál de las siguientes estructuras tendrá la menor velocidad de conducción del potencial de acción cardíaco?", "respuesta": "Fibras del haz AV."}, {"pregunta": "Relacione: Nódulo sinusal", "respuesta": "Aproximadamente 0,05 m/s."}, {"pregunta": "Relacione: Miocardio auricular", "respuesta": "de 0,8 a 1,0 m/s aproximadamente."}, {"pregunta": "Relacione: Nódulo atrioventricular", "respuesta": "de 0,05 a 1,0 m/s aproximadamente."}, {"pregunta": "Relacione: Fibras de Purkinje", "respuesta": "de 2,0 a 4,0 m/s aproximadamente."}, {"pregunta": "Relacione: Miocardio ventricular", "respuesta": "de 0,5 a 1,0 m/s aproximadamente."}, {"pregunta": "Relacione: Periodo de eyección", "respuesta": "La presión ventricular abre la válvula semilunar."}, {"pregunta": "Relacione: Relajación isovolumétrica", "respuesta": "Disminución de la presión intraventricular."}, {"pregunta": "Relacione: Contracción isovolumétrica", "respuesta": "Aumento de la presión ventricular."}, {"pregunta": "Relacione: Periodo de diástole", "respuesta": "La presión ventricular abre la válvula atrioventricular."}, {"pregunta": "Relacione: Diástasis", "respuesta": "Fase prolongada del ciclo cardíaco."}, {"pregunta": "Relacione: Finaliza repolarización ventricular", "respuesta": "Relajación ventricular isovolumétrica."}, {"pregunta": "Relacione: Válvulas cardíacas cerradas", "respuesta": "Contracción ventricular isovolumétrica."}, {"pregunta": "Relacione: Máximo valor en la presión ventricular", "respuesta": "Eyección ventricular rápida."}, {"pregunta": "Relacione: Fase prolongada del ciclo cardíaco", "respuesta": "Diástasis."}, {"pregunta": "Relacione: Abertura de la válvula bicúspide", "respuesta": "Llenado ventricular rápido."}, {"pregunta": "Relacione: Capacidad del corazón de responder a un estímulo adecuado", "respuesta": "Batmotropismo."}, {"pregunta": "Relacione: Capacidad del músculo cardíaco para relajarse", "respuesta": "Lusitropismo."}, {"pregunta": "Relacione: Capacidad del corazón para contraerse", "respuesta": "Inotropismo."}, {"pregunta": "Relacione: Capacidad de las células cardíacas de contraerse con frecuencia", "respuesta": "Cronotropismo."}, {"pregunta": "Relacione: Capacidad del corazón para conducir el impulso eléctrico", "respuesta": "Dromotropismo."}, {"pregunta": "Relacione: Fase 0", "respuesta": "Despolarización rápida."}, {"pregunta": "Relacione: Fase 1", "respuesta": "Repolarización inicial."}, {"pregunta": "Relacione: Fase 2", "respuesta": "Meseta."}, {"pregunta": "Relacione: Fase 3", "respuesta": "Repolarización rápida."}, {"pregunta": "Relacione: Fase 4", "respuesta": "Potencial de reposo."}, {"pregunta": "Relacione: Sístole", "respuesta": "0,27 segundos."}, {"pregunta": "Relacione: Diástole", "respuesta": "0,53 segundos."}, {"pregunta": "Relacione: Eyección", "respuesta": "0,22 segundos."}, {"pregunta": "Relacione: Llenado ventricular", "respuesta": "0,34 segundos."}, {"pregunta": "Relacione: Relajación isométrica", "respuesta": "0,10 segundos."}, {"pregunta": "¿En qué órganos es producida en mayor concentración la enzima convertidora de angiotensina?", "respuesta": "Pulmones"}, {"pregunta": "¿En dónde se cataliza la conversión de angiotensina I a angiotensina II principalmente?", "respuesta": "Pulmones"}, {"pregunta": "¿Cuál es el ion más importante en la composición del surfactante?", "respuesta": "Calcio"}, {"pregunta": "En el transporte de CO2 ¿Quién cataliza la reacción de CO2 con el agua?", "respuesta": "Anhidrasa carbónica"}, {"pregunta": "¿Cómo se llamada a la estructura constituida por un bronquio respiratorio, conductos alveolares y alvéolos?", "respuesta": "Unidad respiratoria"}, {"pregunta": "¿Para que ocurra un aumento del flujo sanguíneo cerebral que ion debe estar en concentraciones bajas?", "respuesta": "Oxígeno"}, {"pregunta": "¿Qué reflejo utiliza receptores de estiramiento en los bronquios para detener la inspiración excesiva?", "respuesta": "Reflejo de insuflación de Hering-Breuer"}, {"pregunta": "Los quimiorreceptores centrales se caracterizan por:", "respuesta": "No detectan cambios de pO2 y detectan cambios de pCO2 de forma indirecta."}, {"pregunta": "¿Dónde se encuent ñones"}, {"pregunta": "Nombre de la enzima que cataliza la conversión de angiotensinógeno en angiotensina I en el plasma.", "respuesta": "Renina"}, {"pregunta": "¿Con qué otro nombre se conoce a la renina?", "respuesta": "Angiotensinogenasa"}, {"pregunta": "Hormona sintetizada por las células yuxtaglomerulares en situaciones de baja volemia o presión arterial.", "respuesta": "Renina"}, {"pregunta": "¿Qué ion en el túbulo contorneado proximal se reabsorbe en paralelo al sodio y agua?.", "respuesta": "Calcio"}, {"pregunta": "Término para describir la excreción de orina en términos cuantitativos y cualitativos en un tiempo determinado.", "respuesta": "Diuresis"}, {"pregunta": "¿Dónde se reabsorbe la mayor cantidad de agua en la nefrona?", "respuesta": "Túbulo proximal"}, {"pregunta": "¿Qué porción del túbulo distal excreta potasio?", "respuesta": "Porción distal o final"}, {"pregunta": "La rama descendente del Asa de Henle cuando pasa el agua se caracteriza por ser", "respuesta": "Permeable"}, {"pregunta": "El plasma se filtra en la cápsula glomerular a través de los capilares glomerulares, este llega a través de la arteriola:", "respuesta": "Aferente"}, {"pregunta": "¿Cuál es la fórmula del ácido carbónico?", "respuesta": "H2CO3"}, {"pregunta": "La anhidrasa carbónica juega un papel importante en el equilibrio ácido base, ella se encuentra en:", "respuesta": "En la mayoría de las células."}, {"pregunta": "Cuando aumenta la ingesta de potasio en la dieta, el equilibrio del potasio se mantiene mediante la excreción de este. ¿Cuál es el principal mecanismo por el que tiene lugar la excreción?", "respuesta": "Aumento de la secreción de potasio en los túbulos contorneados distales."}, {"pregunta": "¿Qué cambio esperaría encontrar en una persona deshidratada privada de agua durante 24 horas?", "respuesta": "Aumento de la permeabilidad al agua en el tubo colector."}, {"pregunta": "¿Qué mecanismo provoca aumento del flujo sanguíneo renal y del filtrado glomerular?", "respuest   function encontrarMateria(texto){
    const t = normalizar(texto);
    let mejor = null;
    for (const key in MATERIAS) {
      const m = MATERIAS[key];
      for (const alias of m.aliases) {
        if (t.includes(normalizar(alias))) {
          if (!mejor || alias.length > mejor.aliasLen) mejor = { key, aliasLen: alias.length };
        }
      }
    }
    return mejor ? mejor.key : null;
  }

  function mezclar(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  const PALABRAS_VACIAS = new Set(['de','la','el','los','las','en','y','a','del','al','que','un','una','se','su','con','por','o','es','son','para','no']);

  function palabrasClave(texto){
    return normalizar(texto)
      .replace(/[^a-z0-9ñ\s]/g, ' ')
      .split(/\s+/)
      .filter(w => w.length > 2 && !PALABRAS_VACIAS.has(w));
  }

  function evaluarCoincidencia(respuestaUsuario, respuestaCorrecta){
    const claves = palabrasClave(respuestaCorrecta);
    if (claves.length === 0) return false;
    const textoUsuario = normalizar(respuestaUsuario);
    let coincide = 0;
    claves.forEach(c => { if (textoUsuario.includes(c)) coincide++; });
    const ratio = coincide / claves.length;
    // Para respuestas muy cortas (1-2 palabras clave) exigir coincidencia total
    if (claves.length <= 2) return ratio === 1;
    return ratio >= 0.5;
  }

  const ESTADO = { IDLE: 'IDLE', ESPERANDO_MATERIA: 'ESPERANDO_MATERIA', ESPERANDO_RESPUESTA: 'ESPERANDO_RESPUESTA' };
  let estado = ESTADO.IDLE;
  let materiaActualKey = null;
  let colaPreguntas = [];
  let preguntaActual = null;

  const FRASES_CORRECTO = [
    'Correcto, señor.',
    'Así es, señor. Bien hecho.',
    'Exacto, señor.',
    'Perfecto, señor.'
  ];
  const FRASES_INCORRECTO = [
    'Esa no es, señor. Debo decir que estoy decepcionado.',
    'Incorrecto, señor. Sigamos con la siguiente.',
    'Me temo que no, señor.',
    'No es correcta, señor.'
  ];

  function saludo(){
    const h = new Date().getHours();
    if (h < 12) return 'Buenos días, señor.';
    if (h < 19) return 'Buenas tardes, señor.';
    return 'Buenas noches, señor.';
  }

  function actualizarBadge(){
    if (materiaActualKey && MATERIAS[materiaActualKey]) {
      materiaBadge.innerHTML = 'Materia: <b>' + MATERIAS[materiaActualKey].label + '</b>';
    } else {
      materiaBadge.textContent = '';
    }
  }

  function iniciarConversacion(){
    estado = ESTADO.ESPERANDO_MATERIA;
    materiaActualKey = null;
    actualizarBadge();
    hablar(saludo() + ' ¿Qué materia deseas estudiar hoy, señor?', () => escucharComando());
  }

  function prepararCola(key){
    materiaActualKey = key;
    colaPreguntas = mezclar(MATERIAS[key].preguntas);
    actualizarBadge();
  }

  function siguientePregunta(){
    if (colaPreguntas.length === 0) {
      colaPreguntas = mezclar(MATERIAS[materiaActualKey].preguntas);
    }
    preguntaActual = colaPreguntas.pop();
    estado = ESTADO.ESPERANDO_RESPUESTA;
    hablar(preguntaActual.pregunta, () => escucharComando());
  }

  function esComandoApagar(texto){
    const t = normalizar(texto);
    return /apaga|apagate|apágate/.test(t);
  }

  function procesarMateria(texto){
    if (esComandoApagar(texto)) { apagarSistema(); return; }
    const key = encontrarMateria(texto);
    if (!key) {
      hablar('No reconozco esa materia, señor. ¿Podrías repetirla?', () => escucharComando());
      return;
    }
    if (!MATERIAS[key].preguntas.length) {
      hablar('Aún no tengo un banco de preguntas para ' + MATERIAS[key].label + ', señor. ¿Qué otra materia deseas estudiar?', () => escucharComando());
      return;
    }
    prepararCola(key);
    hablar('Perfecto, señor. Estudiaremos ' + MATERIAS[key].label + '.', () => siguientePregunta());
  }

  function procesarRespuesta(texto){
    if (esComandoApagar(texto)) { apagarSistema(); return; }
    const correcto = evaluarCoincidencia(texto, preguntaActual.respuesta);
    const frase = correcto
      ? FRASES_CORRECTO[Math.floor(Math.random() * FRASES_CORRECTO.length)]
      : FRASES_INCORRECTO[Math.floor(Math.random() * FRASES_INCORRECTO.length)];
    const completo = frase + ' La respuesta correcta era: ' + preguntaActual.respuesta;
    hablar(completo, () => siguientePregunta());
  }

  function apagarSistema(){
    estado = ESTADO.IDLE;
    materiaActualKey = null;
    preguntaActual = null;
    actualizarBadge();
    statusEl.innerHTML = '<b>Escuchando</b> — aplaude cerca del micrófono';
    hablar('Como digas, señor. Aquí estaré cuando me necesites.');
  }

  /* --- Reconocimiento de voz --- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let reconocedor = null;
  if (SR) {
    reconocedor = new SR();
    reconocedor.lang = 'es-ES';
    reconocedor.continuous = false;
    reconocedor.interimResults = false;
  }

  function escucharComando(){
    if (!reconocedor || estado === ESTADO.IDLE) return;
    statusEl.innerHTML = '<span class="listen-indicator"><span class="listen-dot"></span> Escuchando, señor…</span>';
    try { reconocedor.start(); } catch(e) { /* ya estaba activo */ }
  }

  if (reconocedor) {
    reconocedor.onresult = (event) => {
      const texto = event.results[0][0].transcript;
      captionEl.textContent = `Escuché: "${texto}"`;
      if (estado === ESTADO.ESPERANDO_MATERIA) procesarMateria(texto);
      else if (estado === ESTADO.ESPERANDO_RESPUESTA) procesarRespuesta(texto);
    };
    reconocedor.onerror = () => {
      if (estado !== ESTADO.IDLE) {
        setTimeout(() => escucharComando(), 700);
      }
    };
    reconocedor.onend = () => {
      // El reinicio real ocurre tras hablar() tanto en éxito como en error;
      // esto es solo una red de seguridad ante silencios sin resultado ni error.
    };
  }

  /* =========================================================

  const CLAVE_STORAGE = 'jarvis_conocimiento_v1';
  const SEMILLA_CONOCIMIENTO = [];

  function cargarConocimiento(){
    try {
      const guardado = localStorage.getItem(CLAVE_STORAGE);
      if (guardado) return JSON.parse(guardado);
    } catch(e) { /* localStorage no disponible o dato corrupto */ }
    return SEMILLA_CONOCIMIENTO.slice();
  }
  function guardarConocimiento(){
    try { localStorage.setItem(CLAVE_STORAGE, JSON.stringify(CONOCIMIENTO)); }
    catch(e) { console.warn('No se pudo guardar en localStorage', e); }
  }
  let CONOCIMIENTO = cargarConocimiento();

  const panelToggle = document.getElementById('panelToggle');
  const panelOverlay = document.getElementById('panelOverlay');
  const cerrarPanel = document.getElementById('cerrarPanel');
  const fMateria = document.getElementById('fMateria');
  const fClaves = document.getElementById('fClaves');
  const fPregunta = document.getElementById('fPregunta');
  const fRespuesta = document.getElementById('fRespuesta');
  const agregarBtn = document.getElementById('agregarBtn');
  const exportarBtn = document.getElementById('exportarBtn');
  const importarBtn = document.getElementById('importarBtn');
  const importarInput = document.getElementById('importarInput');
  const listaConocimiento = document.getElementById('listaConocimiento');

  function renderLista(){
    listaConocimiento.innerHTML = '';
    CONOCIMIENTO.forEach((item, idx) => {
      const div = document.createElement('div');
      div.className = 'item-conocimiento';
      div.innerHTML = `
        <div class="txt">
          <div class="materia-tag">${item.materia}</div>
          <div class="pregunta">${item.pregunta || item.claves.join(', ')}</div>
          <div class="respuesta">${item.respuesta}</div>
        </div>
        <button data-idx="${idx}">Eliminar</button>
      `;
      listaConocimiento.appendChild(div);
    });
    listaConocimiento.querySelectorAll('button[data-idx]').forEach(btn => {
      btn.addEventListener('click', () => {
        CONOCIMIENTO.splice(Number(btn.dataset.idx), 1);
        guardarConocimiento();
        renderLista();
      });
    });
  }

  panelToggle.addEventListener('click', () => { panelOverlay.classList.add('open'); renderLista(); });
  cerrarPanel.addEventListener('click', () => panelOverlay.classList.remove('open'));
  panelOverlay.addEventListener('click', (e) => { if (e.target === panelOverlay) panelOverlay.classList.remove('open'); });

  agregarBtn.addEventListener('click', () => {
    const claves = fClaves.value.split(',').map(s => s.trim()).filter(Boolean);
    const respuesta = fRespuesta.value.trim();
    if (!claves.length || !respuesta) { alert('Escribe al menos una palabra clave y una respuesta.'); return; }
    CONOCIMIENTO.push({ materia: fMateria.value, claves, pregunta: fPregunta.value.trim(), respuesta });
    guardarConocimiento();
    fClaves.value = ''; fPregunta.value = ''; fRespuesta.value = '';
    renderLista();
  });

  exportarBtn.addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(CONOCIMIENTO, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'conocimiento.json';
    a.click();
    URL.revokeObjectURL(url);
  });

  importarBtn.addEventListener('click', () => importarInput.click());
  importarInput.addEventListener('change', () => {
    const file = importarInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const datos = JSON.parse(reader.result);
        if (Array.isArray(datos)) { CONOCIMIENTO = datos; guardarConocimiento(); renderLista(); }
        else { alert('El archivo no tiene el formato esperado.'); }
      } catch(e) { alert('No se pudo leer el archivo JSON.'); }
    };
    reader.readAsText(file);
    importarInput.value = '';
  });

  /* =========================================================
     Detección de aplauso (audio)
     ========================================================= */
  let audioCtx, analyser, dataArray, source;
  let cooldown = false;
  const HISTORY = [];
  const HISTORY_LEN = 6;
  const THRESHOLD_JUMP = 42;
  const MIN_LEVEL = 55;

  async function iniciar(){
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0.2;
      source.connect(analyser);
      dataArray = new Uint8Array(analyser.frequencyBinCount);

      startBtn.disabled = true;
      startBtn.textContent = "SISTEMA ACTIVO";
      statusEl.innerHTML = '<b>Escuchando</b> — aplaude cerca del micrófono';
      coreGlow.classList.add('listening');
      hablar("Sistema activado. Aplaude cuando quieras comenzar, señor.");
      loop();
    } catch (err) {
      statusEl.textContent = "No se pudo acceder al micrófono. Revisa permisos del navegador.";
      console.error(err);
    }
  }

  function nivelPromedio(){
    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
    return sum / dataArray.length;
  }

  function dibujarOnda(nivel, activo){
    ctx.clearRect(0,0,canvas.width, canvas.height);
    const cx = canvas.width/2, cy = canvas.height/2;
    const baseR = 60;
    const bars = 64;
    for (let i=0;i<bars;i++){
      const idx = Math.floor(i * dataArray.length / bars);
      const v = dataArray[idx] / 255;
      const len = 6 + v * (activo ? 46 : 26);
      const angle = (i / bars) * Math.PI * 2;
      const x1 = cx + Math.cos(angle) * baseR;
      const y1 = cy + Math.sin(angle) * baseR;
      const x2 = cx + Math.cos(angle) * (baseR + len);
      const y2 = cy + Math.sin(angle) * (baseR + len);
      ctx.strokeStyle = activo ? 'rgba(79,216,255,0.9)' : 'rgba(79,216,255,0.35)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x1,y1);
      ctx.lineTo(x2,y2);
      ctx.stroke();
    }
  }

  function activarHUD(on){
    ['ring1','ring2','ring3'].forEach(id => document.getElementById(id).classList.toggle('active', on));
    document.querySelectorAll('.tick').forEach(t => t.classList.toggle('active', on));
  }

  function dispararAplauso(){
    if (cooldown) return;
    if (estado !== ESTADO.IDLE) return; // ya hay una conversación activa
    cooldown = true;
    coreGlow.classList.add('triggered');
    activarHUD(true);
    statusEl.innerHTML = '<b>Aplauso detectado</b>';
    iniciarConversacion();
    setTimeout(() => {
      coreGlow.classList.remove('triggered');
      activarHUD(false);
      cooldown = false;
    }, 4200);
  }

  function loop(){
    analyser.getByteFrequencyData(dataArray);
    const nivel = nivelPromedio();

    HISTORY.push(nivel);
    if (HISTORY.length > HISTORY_LEN) HISTORY.shift();

    const promedioPrevio = HISTORY.length > 1
      ? HISTORY.slice(0, -1).reduce((a,b)=>a+b,0) / (HISTORY.length - 1)
      : 0;
    const salto = nivel - promedioPrevio;

    meterFill.style.width = Math.min(100, (nivel/120)*100) + '%';
    meterFill.classList.toggle('hot', nivel > MIN_LEVEL);

    dibujarOnda(nivel, cooldown);

    if (!cooldown && nivel > MIN_LEVEL && salto > THRESHOLD_JUMP) {
      dispararAplauso();
    }

    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', iniciar);
})();
</script>
