<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Detector de Aplauso</title>
<style>
  :root {
    --bg: #030608;
    --core: #4fd8ff;
    --core-dim: #1a6b85;
    --ring: #0d2b36;
    --text: #cdeffb;
    --text-dim: #5f8a96;
    --warn: #ff6b4a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(ellipse at center, #061014 0%, var(--bg) 70%);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text);
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: 100%; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  .core-wrap {
    position: relative;
    width: min(70vw, 340px);
    height: min(70vw, 340px);
  }

  svg.rings { position: absolute; inset: 0; width: 100%; height: 100%; }

  .ring { fill: none; stroke: var(--ring); stroke-width: 1.4; transition: stroke .25s ease; }
  .ring.active { stroke: var(--core-dim); }

  .tick { stroke: var(--ring); stroke-width: 1; }
  .tick.active { stroke: var(--core); }

  .core-glow {
    position: absolute;
    top: 50%; left: 50%;
    width: 34%; height: 34%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, var(--core) 0%, var(--core-dim) 55%, transparent 75%);
    box-shadow: 0 0 40px 6px rgba(79, 216, 255, 0.25);
    opacity: 0.45;
    transition: opacity .2s ease, box-shadow .2s ease, transform .2s ease;
  }
  .core-glow.listening { opacity: 0.65; }
  .core-glow.triggered {
    opacity: 1;
    box-shadow: 0 0 90px 20px rgba(79, 216, 255, 0.55);
    transform: translate(-50%, -50%) scale(1.12);
  }

  .bars {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .bars canvas { width: 100%; height: 100%; }

  .status {
    margin-top: 34px;
    text-align: center;
    letter-spacing: 0.12em;
    font-size: 13px;
    color: var(--text-dim);
    min-height: 20px;
  }
  .status b { color: var(--core); font-weight: 500; }

  .caption {
    margin-top: 10px;
    max-width: 420px;
    text-align: center;
    font-size: 16px;
    line-height: 1.5;
    color: var(--text);
    min-height: 48px;
    padding: 0 20px;
  }

  .startbtn {
    margin-top: 26px;
    padding: 10px 22px;
    background: transparent;
    border: 1px solid var(--core-dim);
    color: var(--core);
    border-radius: 4px;
    font-size: 13px;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all .2s ease;
  }
  .startbtn:hover { background: rgba(79,216,255,0.08); border-color: var(--core); }
  .startbtn:disabled { opacity: 0.3; cursor: default; }

  .meter {
    position: absolute;
    bottom: 26px; left: 50%;
    transform: translateX(-50%);
    width: min(80vw, 260px);
    height: 4px;
    background: var(--ring);
    border-radius: 2px;
    overflow: hidden;
  }
  .meter-fill {
    height: 100%; width: 0%;
    background: var(--core-dim);
    transition: width .05s linear;
  }
  .meter-fill.hot { background: var(--warn); }

  .corner {
    position: absolute;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--text-dim);
  }
  .corner.tl { top: 18px; left: 18px; }
  .corner.tr { top: 18px; right: 18px; text-align: right; }

  .voicebar {
    margin-top: 18px;
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--text-dim);
  }
  .voicebar select {
    background: #061014;
    color: var(--text);
    border: 1px solid var(--ring);
    border-radius: 4px;
    padding: 5px 8px;
    font-size: 12px;
    max-width: 220px;
  }
  .voicebar select:focus { outline: 1px solid var(--core-dim); }

  .listen-indicator {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .listen-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--warn);
    box-shadow: 0 0 8px 2px rgba(255,107,74,0.6);
    animation: pulse 1s infinite ease-in-out;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  /* --- Panel de materias --- */
  .panel-toggle {
    position: absolute;
    bottom: 18px; right: 18px;
    background: transparent;
    border: 1px solid var(--ring);
    color: var(--text-dim);
    border-radius: 4px;
    padding: 8px 12px;
    font-size: 11px;
    letter-spacing: 0.06em;
    cursor: pointer;
  }
  .panel-toggle:hover { border-color: var(--core-dim); color: var(--text); }

  .panel-overlay {
    position: fixed; inset: 0;
    background: rgba(2,6,8,0.88);
    display: none;
    align-items: center; justify-content: center;
    z-index: 20;
    padding: 24px;
  }
  .panel-overlay.open { display: flex; }

  .panel-box {
    width: min(560px, 100%);
    max-height: 84vh;
    overflow-y: auto;
    background: #061014;
    border: 1px solid var(--ring);
    border-radius: 8px;
    padding: 22px 24px;
  }
  .panel-box h2 {
    margin: 0 0 4px;
    font-size: 15px;
    letter-spacing: 0.08em;
    color: var(--core);
    font-weight: 500;
  }
  .panel-box p.hint {
    margin: 0 0 16px;
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.5;
  }
  .campo { margin-bottom: 12px; }
  .campo label {
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 4px;
    letter-spacing: 0.04em;
  }
  .campo input, .campo select, .campo textarea {
    width: 100%;
    background: #030608;
    color: var(--text);
    border: 1px solid var(--ring);
    border-radius: 4px;
    padding: 8px 9px;
    font-size: 13px;
    font-family: inherit;
    resize: vertical;
  }
  .campo textarea { min-height: 54px; }
  .panel-actions { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .panel-actions button {
    background: transparent;
    border: 1px solid var(--core-dim);
    color: var(--core);
    border-radius: 4px;
    padding: 8px 14px;
    font-size: 12px;
    cursor: pointer;
  }
  .panel-actions button:hover { background: rgba(79,216,255,0.08); }
  .panel-actions button.secundario {
    border-color: var(--ring); color: var(--text-dim);
  }
  .panel-actions input[type=file] { display: none; }

  .lista-conocimiento {
    margin-top: 20px;
    border-top: 1px solid var(--ring);
    padding-top: 14px;
  }
  .item-conocimiento {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(13,43,54,0.6);
    font-size: 12.5px;
  }
  .item-conocimiento .txt { flex: 1; }
  .item-conocimiento .materia-tag {
    color: var(--core);
    font-size: 10.5px;
    letter-spacing: 0.05em;
  }
  .item-conocimiento .pregunta { color: var(--text); margin: 2px 0; }
  .item-conocimiento .respuesta { color: var(--text-dim); }
  .item-conocimiento button {
    background: none; border: none;
    color: var(--warn);
    cursor: pointer;
    font-size: 12px;
    height: fit-content;
  }
  .cerrar-panel {
    float: right;
    background: none; border: none;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="corner tl">SISTEMA · ESCUCHA ACTIVA</div>
  <div class="corner tr" id="clockCorner">--:--:--</div>

  <div class="core-wrap">
    <svg class="rings" viewBox="0 0 200 200">
      <circle class="ring" id="ring1" cx="100" cy="100" r="92"/>
      <circle class="ring" id="ring2" cx="100" cy="100" r="74"/>
      <circle class="ring" id="ring3" cx="100" cy="100" r="58"/>
      <g id="ticks"></g>
    </svg>
    <div class="bars"><canvas id="waveCanvas" width="340" height="340"></canvas></div>
    <div class="core-glow" id="coreGlow"></div>
  </div>

  <div class="meter"><div class="meter-fill" id="meterFill"></div></div>

  <div class="status" id="status">Presiona <b>ACTIVAR</b> para habilitar el micrófono</div>
  <div class="caption" id="caption"></div>
  <button class="startbtn" id="startBtn">ACTIVAR SISTEMA</button>

  <div class="voicebar">
    <label for="voiceSelect">Voz</label>
    <select id="voiceSelect"></select>
  </div>
</div>

<button class="panel-toggle" id="panelToggle">📚 MATERIAS</button>

<div class="panel-overlay" id="panelOverlay">
  <div class="panel-box">
    <button class="cerrar-panel" id="cerrarPanel">✕</button>
    <h2>PANEL DE MATERIAS</h2>
    <p class="hint">Agrega preguntas y respuestas de tus materias. Cuando digas algo parecido a la pregunta o a las palabras clave, el sistema responderá con lo que escribiste aquí.</p>

    <div class="campo">
      <label for="fMateria">Materia</label>
      <select id="fMateria">
        <option>Fisiología</option>
        <option>Parasitología</option>
        <option>Citología / Histología</option>
        <option>Psicología</option>
        <option>Epidemiología</option>
        <option>Química</option>
        <option>General</option>
      </select>
    </div>
    <div class="campo">
      <label for="fClaves">Palabras clave (separadas por coma — lo que dirías en voz alta)</label>
      <input type="text" id="fClaves" placeholder="ej: nefrona, filtración glomerular">
    </div>
    <div class="campo">
      <label for="fPregunta">Pregunta (referencia, opcional)</label>
      <input type="text" id="fPregunta" placeholder="ej: ¿Qué es la nefrona?">
    </div>
    <div class="campo">
      <label for="fRespuesta">Respuesta que dirá en voz alta</label>
      <textarea id="fRespuesta" placeholder="ej: La nefrona es la unidad funcional del riñón..."></textarea>
    </div>

    <div class="panel-actions">
      <button id="agregarBtn">+ Agregar</button>
      <button class="secundario" id="exportarBtn">⬇ Exportar JSON</button>
      <button class="secundario" id="importarBtn">⬆ Importar JSON</button>
      <input type="file" id="importarInput" accept="application/json">
    </div>

    <div class="lista-conocimiento" id="listaConocimiento"></div>
  </div>
</div>

<script>
(function(){
  const startBtn = document.getElementById('startBtn');
  const statusEl = document.getElementById('status');
  const captionEl = document.getElementById('caption');
  const coreGlow = document.getElementById('coreGlow');
  const meterFill = document.getElementById('meterFill');
  const clockCorner = document.getElementById('clockCorner');
  const canvas = document.getElementById('waveCanvas');
  const ctx = canvas.getContext('2d');

  // Ticks decorativos alrededor del anillo exterior
  const ticksGroup = document.getElementById('ticks');
  const TICK_COUNT = 48;
  for (let i = 0; i < TICK_COUNT; i++) {
    const angle = (i / TICK_COUNT) * Math.PI * 2;
    const r1 = 96, r2 = 100;
    const x1 = 100 + r1 * Math.cos(angle);
    const y1 = 100 + r1 * Math.sin(angle);
    const x2 = 100 + r2 * Math.cos(angle);
    const y2 = 100 + r2 * Math.sin(angle);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.classList.add('tick');
    line.dataset.idx = i;
    ticksGroup.appendChild(line);
  }

  function setClock(){
    clockCorner.textContent = new Date().toLocaleTimeString('es-PA', {hour12:false});
  }
  setClock();
  setInterval(setClock, 1000);

  // --- Respuestas tipo Jarvis ---
  const RESPONSES = [
    "A la orden. Sistema activo.",
    "Te escucho. ¿Qué necesitas?",
    "Aplauso registrado. Todo en orden.",
    "Aquí estoy. Dime qué hacemos.",
    "Sistema en línea y a tu disposición."
  ];

  let voz = null;
  const voiceSelect = document.getElementById('voiceSelect');

  // Palabras que suelen indicar una voz de mayor calidad (motor de red vs. local)
  const PISTAS_CALIDAD = ['google', 'natural', 'online', 'neural', 'microsoft'];

  function poblarVoces(){
    const voces = speechSynthesis.getVoices();
    if (!voces.length) return;

    // Todas primero, priorizando español y voces de mejor calidad
    const ordenadas = [...voces].sort((a, b) => {
      const aEs = a.lang && a.lang.startsWith('es') ? 1 : 0;
      const bEs = b.lang && b.lang.startsWith('es') ? 1 : 0;
      if (aEs !== bEs) return bEs - aEs;
      const aCal = PISTAS_CALIDAD.some(p => a.name.toLowerCase().includes(p)) ? 1 : 0;
      const bCal = PISTAS_CALIDAD.some(p => b.name.toLowerCase().includes(p)) ? 1 : 0;
      return bCal - aCal;
    });

    voiceSelect.innerHTML = '';
    ordenadas.forEach((v, i) => {
      const opt = document.createElement('option');
      opt.value = v.name;
      opt.textContent = `${v.name} (${v.lang})`;
      voiceSelect.appendChild(opt);
    });

    // Preselecciona la mejor opción en español
    const mejor = ordenadas.find(v => v.lang && v.lang.startsWith('es') &&
      PISTAS_CALIDAD.some(p => v.name.toLowerCase().includes(p))) || ordenadas[0];
    voz = mejor;
    voiceSelect.value = mejor.name;
  }

  voiceSelect.addEventListener('change', () => {
    const voces = speechSynthesis.getVoices();
    voz = voces.find(v => v.name === voiceSelect.value) || voz;
  });

  if ('speechSynthesis' in window) {
    speechSynthesis.onvoiceschanged = poblarVoces;
    poblarVoces();
  }

  function hablar(texto, alTerminar){
    captionEl.textContent = texto;
    if (!('speechSynthesis' in window)) { if (alTerminar) alTerminar(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    if (voz) u.voice = voz;
    u.lang = (voz && voz.lang) || 'es-ES';
    u.pitch = 1.0;
    u.rate = 1.0;
    if (alTerminar) u.onend = alTerminar;
    speechSynthesis.speak(u);
  }

  // --- Reconocimiento de voz: escucha un comando después del aplauso ---
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let reconocedor = null;
  if (SR) {
    reconocedor = new SR();
    reconocedor.lang = 'es-ES';
    reconocedor.continuous = false;
    reconocedor.interimResults = false;
  }

  // Reglas simples de comando -> respuesta (palabra clave incluida en lo que dijiste)
  const COMANDOS = [
    { claves: ['hola', 'buenas'], respuesta: '¡Hola! ¿En qué te ayudo?' },
    { claves: ['estado', 'como estas', 'cómo estás'], respuesta: 'Todos los sistemas funcionando con normalidad.' },
    { claves: ['gracias'], respuesta: 'A la orden, cuando quieras.' },
    { claves: ['hora'], respuesta: () => `Son las ${new Date().toLocaleTimeString('es-PA',{hour:'2-digit',minute:'2-digit'})}.` },
    { claves: ['adios', 'adiós', 'hasta luego'], respuesta: 'Hasta luego. Aquí estaré si me necesitas.' },
  ];

  // --- Base de conocimiento por materias (Fisiología, Parasitología, etc.) ---
  const CLAVE_STORAGE = 'jarvis_conocimiento_v1';

  const SEMILLA_CONOCIMIENTO = [
    { materia: 'Fisiología', claves: ['nefrona', 'unidad funcional del riñon', 'unidad funcional del riñón'],
      pregunta: '¿Qué es la nefrona?',
      respuesta: 'La nefrona es la unidad funcional y estructural del riñón, encargada de filtrar la sangre y formar la orina.' },
    { materia: 'Parasitología', claves: ['tecnica de ritchie', 'técnica de ritchie'],
      pregunta: '¿Para qué sirve la técnica de Ritchie?',
      respuesta: 'La técnica de Ritchie es un método de concentración por sedimentación que se usa para detectar huevos y quistes de parásitos en heces.' },
    { materia: 'Citología / Histología', claves: ['gastritis'],
      pregunta: '¿Qué es la gastritis?',
      respuesta: 'La gastritis es la inflamación de la mucosa gástrica, que puede ser aguda o crónica y suele estudiarse mediante biopsia y citología.' },
    { materia: 'Psicología', claves: ['memoria a corto plazo'],
      pregunta: '¿Qué es la memoria a corto plazo?',
      respuesta: 'La memoria a corto plazo retiene información por segundos o minutos, con una capacidad limitada, antes de pasar o no a la memoria a largo plazo.' },
    { materia: 'Epidemiología', claves: ['incidencia', 'prevalencia'],
      pregunta: '¿Cuál es la diferencia entre incidencia y prevalencia?',
      respuesta: 'La incidencia mide los casos nuevos de una enfermedad en un periodo, mientras que la prevalencia mide el total de casos existentes, nuevos y antiguos, en un momento dado.' },
    { materia: 'Química', claves: ['ph', 'potencial de hidrogeno', 'potencial de hidrógeno'],
      pregunta: '¿Qué mide el pH?',
      respuesta: 'El pH mide qué tan ácida o básica es una solución, en una escala de 0 a 14, según la concentración de iones hidrógeno.' },
  ];

  function cargarConocimiento(){
    try {
      const guardado = localStorage.getItem(CLAVE_STORAGE);
      if (guardado) return JSON.parse(guardado);
    } catch(e) { /* localStorage no disponible o dato corrupto */ }
    return SEMILLA_CONOCIMIENTO.slice();
  }

  function guardarConocimiento(){
    try { localStorage.setItem(CLAVE_STORAGE, JSON.stringify(CONOCIMIENTO)); }
    catch(e) { console.warn('No se pudo guardar en localStorage', e); }
  }

  let CONOCIMIENTO = cargarConocimiento();

  function normalizar(s){
    return s.toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, ''); // quita tildes para comparar mejor
  }

  function responderComando(texto){
    const t = normalizar(texto);

    // 1) Base de conocimiento de materias primero (más específico)
    const item = CONOCIMIENTO.find(c => c.claves.some(k => t.includes(normalizar(k))));
    if (item) { hablar(item.respuesta); return; }

    // 2) Comandos generales tipo Jarvis
    const match = COMANDOS.find(c => c.claves.some(k => t.includes(normalizar(k))));
    if (match) {
      const resp = typeof match.respuesta === 'function' ? match.respuesta() : match.respuesta;
      hablar(resp);
      return;
    }

    hablar('No tengo una respuesta lista para eso todavía. Puedes agregarla en el panel de materias.');
  }

  // --- Interfaz del panel de materias ---
  const panelToggle = document.getElementById('panelToggle');
  const panelOverlay = document.getElementById('panelOverlay');
  const cerrarPanel = document.getElementById('cerrarPanel');
  const fMateria = document.getElementById('fMateria');
  const fClaves = document.getElementById('fClaves');
  const fPregunta = document.getElementById('fPregunta');
  const fRespuesta = document.getElementById('fRespuesta');
  const agregarBtn = document.getElementById('agregarBtn');
  const exportarBtn = document.getElementById('exportarBtn');
  const importarBtn = document.getElementById('importarBtn');
  const importarInput = document.getElementById('importarInput');
  const listaConocimiento = document.getElementById('listaConocimiento');

  function renderLista(){
    listaConocimiento.innerHTML = '';
    CONOCIMIENTO.forEach((item, idx) => {
      const div = document.createElement('div');
      div.className = 'item-conocimiento';
      div.innerHTML = `
        <div class="txt">
          <div class="materia-tag">${item.materia}</div>
          <div class="pregunta">${item.pregunta || item.claves.join(', ')}</div>
          <div class="respuesta">${item.respuesta}</div>
        </div>
        <button data-idx="${idx}">Eliminar</button>
      `;
      listaConocimiento.appendChild(div);
    });
    listaConocimiento.querySelectorAll('button[data-idx]').forEach(btn => {
      btn.addEventListener('click', () => {
        CONOCIMIENTO.splice(Number(btn.dataset.idx), 1);
        guardarConocimiento();
        renderLista();
      });
    });
  }

  panelToggle.addEventListener('click', () => {
    panelOverlay.classList.add('open');
    renderLista();
  });
  cerrarPanel.addEventListener('click', () => panelOverlay.classList.remove('open'));
  panelOverlay.addEventListener('click', (e) => { if (e.target === panelOverlay) panelOverlay.classList.remove('open'); });

  agregarBtn.addEventListener('click', () => {
    const claves = fClaves.value.split(',').map(s => s.trim()).filter(Boolean);
    const respuesta = fRespuesta.value.trim();
    if (!claves.length || !respuesta) {
      alert('Escribe al menos una palabra clave y una respuesta.');
      return;
    }
    CONOCIMIENTO.push({
      materia: fMateria.value,
      claves,
      pregunta: fPregunta.value.trim(),
      respuesta
    });
    guardarConocimiento();
    fClaves.value = ''; fPregunta.value = ''; fRespuesta.value = '';
    renderLista();
  });

  exportarBtn.addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(CONOCIMIENTO, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'conocimiento.json';
    a.click();
    URL.revokeObjectURL(url);
  });

  importarBtn.addEventListener('click', () => importarInput.click());
  importarInput.addEventListener('change', () => {
    const file = importarInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const datos = JSON.parse(reader.result);
        if (Array.isArray(datos)) {
          CONOCIMIENTO = datos;
          guardarConocimiento();
          renderLista();
        } else {
          alert('El archivo no tiene el formato esperado.');
        }
      } catch(e) {
        alert('No se pudo leer el archivo JSON.');
      }
    };
    reader.readAsText(file);
    importarInput.value = '';
  });

  function escucharComando(){
    if (!reconocedor) return;
    statusEl.innerHTML = '<span class="listen-indicator"><span class="listen-dot"></span> Escuchando tu comando…</span>';
    try { reconocedor.start(); } catch(e) { /* ya estaba activo */ }
  }

  if (reconocedor) {
    reconocedor.onresult = (event) => {
      const texto = event.results[0][0].transcript;
      captionEl.textContent = `Escuché: "${texto}"`;
      responderComando(texto);
    };
    reconocedor.onerror = () => {
      statusEl.innerHTML = '<b>Escuchando</b> — aplaude cerca del micrófono';
    };
    reconocedor.onend = () => {
      setTimeout(() => {
        if (!cooldown) statusEl.innerHTML = '<b>Escuchando</b> — aplaude cerca del micrófono';
      }, 2400);
    };
  }

  // --- Audio: detección de aplauso ---
  let audioCtx, analyser, dataArray, source, rafId;
  let cooldown = false;
  const HISTORY = [];
  const HISTORY_LEN = 6;   // ventana corta para detectar transiente
  const THRESHOLD_JUMP = 42; // sensibilidad del salto brusco de energía
  const MIN_LEVEL = 55;      // piso para no disparar con silencio/ruido bajo

  async function iniciar(){
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0.2;
      source.connect(analyser);
      dataArray = new Uint8Array(analyser.frequencyBinCount);

      startBtn.disabled = true;
      startBtn.textContent = "SISTEMA ACTIVO";
      statusEl.innerHTML = '<b>Escuchando</b> — aplaude cerca del micrófono';
      coreGlow.classList.add('listening');
      hablar("Sistema activado. Estoy escuchando.");
      loop();
    } catch (err) {
      statusEl.textContent = "No se pudo acceder al micrófono. Revisa permisos del navegador.";
      console.error(err);
    }
  }

  function nivelPromedio(){
    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
    return sum / dataArray.length;
  }

  function dibujarOnda(nivel, activo){
    ctx.clearRect(0,0,canvas.width, canvas.height);
    const cx = canvas.width/2, cy = canvas.height/2;
    const baseR = 60;
    const bars = 64;
    for (let i=0;i<bars;i++){
      const idx = Math.floor(i * dataArray.length / bars);
      const v = dataArray[idx] / 255;
      const len = 6 + v * (activo ? 46 : 26);
      const angle = (i / bars) * Math.PI * 2;
      const x1 = cx + Math.cos(angle) * baseR;
      const y1 = cy + Math.sin(angle) * baseR;
      const x2 = cx + Math.cos(angle) * (baseR + len);
      const y2 = cy + Math.sin(angle) * (baseR + len);
      ctx.strokeStyle = activo ? 'rgba(79,216,255,0.9)' : 'rgba(79,216,255,0.35)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x1,y1);
      ctx.lineTo(x2,y2);
      ctx.stroke();
    }
  }

  function activarHUD(on){
    ['ring1','ring2','ring3'].forEach(id => document.getElementById(id).classList.toggle('active', on));
    document.querySelectorAll('.tick').forEach(t => t.classList.toggle('active', on));
  }

  function dispararAplauso(nivel){
    if (cooldown) return;
    cooldown = true;
    coreGlow.classList.add('triggered');
    activarHUD(true);
    statusEl.innerHTML = '<b>Aplauso detectado</b>';
    const frase = RESPONSES[Math.floor(Math.random()*RESPONSES.length)];
    hablar(frase, () => {
      // Terminó de hablar: abre una ventana breve para escuchar tu comando
      escucharComando();
    });
    setTimeout(() => {
      coreGlow.classList.remove('triggered');
      activarHUD(false);
      cooldown = false;
    }, 4200);
  }

  function loop(){
    analyser.getByteFrequencyData(dataArray);
    const nivel = nivelPromedio();

    HISTORY.push(nivel);
    if (HISTORY.length > HISTORY_LEN) HISTORY.shift();

    const promedioPrevio = HISTORY.length > 1
      ? HISTORY.slice(0, -1).reduce((a,b)=>a+b,0) / (HISTORY.length - 1)
      : 0;
    const salto = nivel - promedioPrevio;

    meterFill.style.width = Math.min(100, (nivel/120)*100) + '%';
    meterFill.classList.toggle('hot', nivel > MIN_LEVEL);

    dibujarOnda(nivel, cooldown);

    if (!cooldown && nivel > MIN_LEVEL && salto > THRESHOLD_JUMP) {
      dispararAplauso(nivel);
    }

    rafId = requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', iniciar);
})();
</script>
</body>
</html>
