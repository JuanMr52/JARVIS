<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Asistente de Estudio</title>
<style>
  :root {
    --bg: #030608;
    --core: #4fd8ff;
    --core-dim: #1a6b85;
    --ring: #0d2b36;
    --text: #cdeffb;
    --text-dim: #5f8a96;
    --warn: #ff6b4a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(ellipse at center, #061014 0%, var(--bg) 70%);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text);
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: 100%; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  .core-wrap {
    position: relative;
    width: min(70vw, 340px);
    height: min(70vw, 340px);
  }

  svg.rings { position: absolute; inset: 0; width: 100%; height: 100%; }

  .ring { fill: none; stroke: var(--ring); stroke-width: 1.4; transition: stroke .25s ease; }
  .ring.active { stroke: var(--core-dim); }

  .tick { stroke: var(--ring); stroke-width: 1; }
  .tick.active { stroke: var(--core); }

  .core-glow {
    position: absolute;
    top: 50%; left: 50%;
    width: 34%; height: 34%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, var(--core) 0%, var(--core-dim) 55%, transparent 75%);
    box-shadow: 0 0 40px 6px rgba(79, 216, 255, 0.25);
    opacity: 0.45;
    transition: opacity .2s ease, box-shadow .2s ease, transform .2s ease;
  }
  .core-glow.listening { opacity: 0.65; }
  .core-glow.triggered {
    opacity: 1;
    box-shadow: 0 0 90px 20px rgba(79, 216, 255, 0.55);
    transform: translate(-50%, -50%) scale(1.12);
  }

  .bars {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .bars canvas { width: 100%; height: 100%; }

  .status {
    margin-top: 34px;
    text-align: center;
    letter-spacing: 0.12em;
    font-size: 13px;
    color: var(--text-dim);
    min-height: 20px;
  }
  .status b { color: var(--core); font-weight: 500; }

  .caption {
    margin-top: 10px;
    max-width: 420px;
    text-align: center;
    font-size: 16px;
    line-height: 1.5;
    color: var(--text);
    min-height: 48px;
    padding: 0 20px;
  }

  .materia-badge {
    margin-top: 6px;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--core-dim);
    min-height: 14px;
  }
  .materia-badge b { color: var(--core); }

  .startbtn {
    margin-top: 26px;
    padding: 10px 22px;
    background: transparent;
    border: 1px solid var(--core-dim);
    color: var(--core);
    border-radius: 4px;
    font-size: 13px;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all .2s ease;
  }
  .startbtn:hover { background: rgba(79,216,255,0.08); border-color: var(--core); }
  .startbtn:disabled { opacity: 0.3; cursor: default; }

  .meter {
    position: absolute;
    bottom: 26px; left: 50%;
    transform: translateX(-50%);
    width: min(80vw, 260px);
    height: 4px;
    background: var(--ring);
    border-radius: 2px;
    overflow: hidden;
  }
  .meter-fill {
    height: 100%; width: 0%;
    background: var(--core-dim);
    transition: width .05s linear;
  }
  .meter-fill.hot { background: var(--warn); }

  .corner {
    position: absolute;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--text-dim);
  }
  .corner.tl { top: 18px; left: 18px; }
  .corner.tr { top: 18px; right: 18px; text-align: right; }

  .voicebar {
    margin-top: 18px;
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--text-dim);
  }
  .voicebar select {
    background: #061014;
    color: var(--text);
    border: 1px solid var(--ring);
    border-radius: 4px;
    padding: 5px 8px;
    font-size: 12px;
    max-width: 220px;
  }

  .panel-toggle {
    position: absolute;
    bottom: 18px; right: 18px;
    background: transparent;
    border: 1px solid var(--ring);
    color: var(--text-dim);
    border-radius: 4px;
    padding: 8px 12px;
    font-size: 11px;
    letter-spacing: 0.06em;
    cursor: pointer;
  }
  .panel-toggle:hover { border-color: var(--core-dim); color: var(--text); }

  .panel-overlay {
    position: fixed; inset: 0;
    background: rgba(2,6,8,0.88);
    display: none;
    align-items: center; justify-content: center;
    z-index: 20;
    padding: 24px;
  }
  .panel-overlay.open { display: flex; }

  .panel-box {
    width: min(560px, 100%);
    max-height: 84vh;
    overflow-y: auto;
    background: #061014;
    border: 1px solid var(--ring);
    border-radius: 8px;
    padding: 22px 24px;
  }
  .panel-box h2 {
    margin: 0 0 4px;
    font-size: 15px;
    letter-spacing: 0.08em;
    color: var(--core);
    font-weight: 500;
  }
  .panel-box p.hint {
    margin: 0 0 16px;
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.5;
  }
  .campo { margin-bottom: 12px; }
  .campo label {
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 4px;
    letter-spacing: 0.04em;
  }
  .campo input, .campo select, .campo textarea {
    width: 100%;
    background: #030608;
    color: var(--text);
    border: 1px solid var(--ring);
    border-radius: 4px;
    padding: 8px 9px;
    font-size: 13px;
    font-family: inherit;
    resize: vertical;
  }
  .campo textarea { min-height: 54px; }
  .panel-actions { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .panel-actions button {
    background: transparent;
    border: 1px solid var(--core-dim);
    color: var(--core);
    border-radius: 4px;
    padding: 8px 14px;
    font-size: 12px;
    cursor: pointer;
  }
  .panel-actions button:hover { background: rgba(79,216,255,0.08); }
  .panel-actions button.secundario {
    border-color: var(--ring); color: var(--text-dim);
  }
  .cerrar-panel {
    float: right;
    background: none; border: none;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="corner tl">SISTEMA · ESCUCHA ACTIVA</div>
  <div class="corner tr" id="clockCorner">--:--:--</div>

  <div class="core-wrap">
    <svg class="rings" viewBox="0 0 200 200">
      <circle class="ring" id="ring1" cx="100" cy="100" r="92"/>
      <circle class="ring" id="ring2" cx="100" cy="100" r="74"/>
      <circle class="ring" id="ring3" cx="100" cy="100" r="58"/>
      <g id="ticks"></g>
    </svg>
    <div class="bars"><canvas id="waveCanvas" width="340" height="340"></canvas></div>
    <div class="core-glow" id="coreGlow"></div>
  </div>

  <div class="meter"><div class="meter-fill" id="meterFill"></div></div>

  <div class="status" id="status">Presiona <b>ACTIVAR SISTEMA</b> para habilitar el micrófono</div>
  <div class="caption" id="caption"></div>
  <div class="materia-badge" id="materiaBadge"></div>
  <button class="startbtn" id="startBtn">ACTIVAR SISTEMA</button>

  <div class="voicebar">
    <label for="voiceSelect">Voz</label>
    <select id="voiceSelect"></select>
  </div>
</div>

<button class="panel-toggle" id="panelToggle">📚 CONOCIMIENTO LIBRE</button>

<div class="panel-overlay" id="panelOverlay">
  <div class="panel-box">
    <button class="cerrar-panel" id="cerrarPanel">✕</button>
    <h2>CONOCIMIENTO POR PALABRA CLAVE (OPCIONAL)</h2>
    <p class="hint">Panel secundario para consultas rápidas fuera de la sesión de estudio.</p>
    <div class="campo">
      <label for="fMateria">Materia</label>
      <select id="fMateria"><option>Fisiología</option><option>General</option></select>
    </div>
  </div>
</div>

<script>
(function(){
  const startBtn = document.getElementById('startBtn');
  const statusEl = document.getElementById('status');
  const captionEl = document.getElementById('caption');
  const materiaBadge = document.getElementById('materiaBadge');
  const coreGlow = document.getElementById('coreGlow');
  const meterFill = document.getElementById('meterFill');
  const clockCorner = document.getElementById('clockCorner');
  const canvas = document.getElementById('waveCanvas');
  const ctx = canvas.getContext('2d');

  // Animación Ticks
  const ticksGroup = document.getElementById('ticks');
  const TICK_COUNT = 48;
  const tickElements = [];
  for (let i = 0; i < TICK_COUNT; i++) {
    const angle = (i / TICK_COUNT) * Math.PI * 2;
    const r1 = 96, r2 = 100;
    const x1 = 100 + r1 * Math.cos(angle);
    const y1 = 100 + r1 * Math.sin(angle);
    const x2 = 100 + r2 * Math.cos(angle);
    const y2 = 100 + r2 * Math.sin(angle);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.classList.add('tick');
    ticksGroup.appendChild(line);
    tickElements.push(line);
  }

  function setClock(){
    clockCorner.textContent = new Date().toLocaleTimeString('es-PA', {hour12:false});
  }
  setClock();
  setInterval(setClock, 1000);

  // Audio Context & Animaciones de Onda
  let audioCtx, analyser, microphone, dataArray;
  let animId;

  function initAudioVisualizer() {
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      microphone = audioCtx.createMediaStreamSource(stream);
      microphone.connect(analyser);
      analyser.fftSize = 64;
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      drawVisualizer();
    }).catch(err => console.log("Audio visualizer error:", err));
  }

  function drawVisualizer() {
    animId = requestAnimationFrame(drawVisualizer);
    if (!analyser) return;
    analyser.getByteFrequencyData(dataArray);

    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
    let average = sum / dataArray.length;

    // Animación de medidor e iluminación central
    meterFill.style.width = Math.min(100, (average / 128) * 100) + '%';
    if (average > 30) {
      coreGlow.classList.add('listening');
      tickElements.forEach((el, idx) => {
        if (Math.random() < average / 100) el.classList.add('active');
        else el.classList.remove('active');
      });
    } else {
      coreGlow.classList.remove('listening');
      tickElements.forEach(el => el.classList.remove('active'));
    }

    // Renderizado en Canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = 70;

    ctx.beginPath();
    ctx.strokeStyle = '#4fd8ff';
    ctx.lineWidth = 2;
    for (let i = 0; i < dataArray.length; i++) {
      const v = dataArray[i] / 128.0;
      const rad = (i / dataArray.length) * Math.PI * 2;
      const r = radius + (v * 15);
      const x = centerX + r * Math.cos(rad);
      const y = centerY + r * Math.sin(rad);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
  }

  // Voces
  let voz = null;
  const voiceSelect = document.getElementById('voiceSelect');

  function poblarVoces(){
    const voces = speechSynthesis.getVoices();
    if (!voces.length) return;
    voiceSelect.innerHTML = '';
    voces.forEach((v) => {
      const opt = document.createElement('option');
      opt.value = v.name;
      opt.textContent = `${v.name} (${v.lang})`;
      voiceSelect.appendChild(opt);
    });
    voz = voces.find(v => v.lang && v.lang.startsWith('es')) || voces[0];
    if (voz) voiceSelect.value = voz.name;
  }

  if ('speechSynthesis' in window) {
    speechSynthesis.onvoiceschanged = poblarVoces;
    poblarVoces();
  }

  function hablar(texto, alTerminar){
    captionEl.textContent = texto;
    if (!('speechSynthesis' in window)) { if (alTerminar) alTerminar(); return; }
    
    // Detener micrófono temporalmente mientras Jarvis habla para evitar bucles
    if (rec && escuchando) rec.stop();

    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    if (voz) u.voice = voz;
    u.lang = (voz && voz.lang) || 'es-ES';
    u.pitch = 1.0;
    u.rate = 1.0;
    
    u.onend = () => {
      if (escuchando) try { rec.start(); } catch(e){}
      if (alTerminar) alTerminar();
    };
    
    speechSynthesis.speak(u);
  }

  function normalizar(s){
    return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
  }

  // Banco de Preguntas
  const MATERIAS = {
    "cardiovascular": {
      "label": "Cardiovascular",
      "aliases": ["cardiovascular", "cardiaco", "cardiologia", "corazon"],
      "preguntas": [
        {"pregunta": "¿Qué tipos de potenciales de acción son característicos en las fibras musculares cardíacas?", "respuesta": "meseta"},
        {"pregunta": "¿Con qué otro nombre se conoce al haz de Bachmann?", "respuesta": "banda interauricular anterior"},
        {"pregunta": "¿De qué no depende el Batmotropismo?", "respuesta": "nodo sinusal"},
        {"pregunta": "¿Término que describe la capacidad del tejido cardíaco de generar sus propios estímulos?", "respuesta": "automatismo"},
        {"pregunta": "¿En dónde se sitúa el nodo sinusal dentro del corazón?", "respuesta": "auricula derecha"},
        {"pregunta": "En el ciclo cardíaco, ¿de cuánto es el volumen sistólico normal?", "respuesta": "70 ml"}
      ]
    },
    "respiratorio": {
      "label": "Respiratorio",
      "aliases": ["respiratorio", "pulmonar", "pulmones", "respiracion"],
      "preguntas": [
        {"pregunta": "¿En qué órganos se produce en mayor concentración la enzima convertidora de angiotensina?", "respuesta": "pulmones"},
        {"pregunta": "¿En el transporte de CO2, quién cataliza la reacción de CO2 con el agua?", "respuesta": "anhidrasa carbonica"},
        {"pregunta": "¿Cuál es la función principal del centro neumotáxico?", "respuesta": "limitar la inspiracion"}
      ]
    },
    "renal": {
      "label": "Renal",
      "aliases": ["renal", "rinon", "rinones"],
      "preguntas": [
        {"pregunta": "¿Dónde se reabsorbe la mayor cantidad de agua en la nefrona?", "respuesta": "tubulo proximal"},
        {"pregunta": "¿Qué hormona es sintetizada por las células yuxtaglomerulares ante baja presión?", "respuesta": "renina"}
      ]
    }
  };

  // Motor de Reconocimiento
  let escuchando = false;
  let estadoEstudio = "INICIO";
  let materiaActual = null;
  let preguntaActual = null;
  let rec = null;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (SpeechRecognition) {
    rec = new SpeechRecognition();
    rec.continuous = true;
    rec.interimResults = true;
    rec.lang = 'es-ES';

    rec.onresult = (e) => {
      let transcripcion = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        transcripcion += e.results[i][0].transcript;
      }
      if (e.results[e.results.length - 1].isFinal) {
        procesarComando(transcripcion);
      }
    };

    rec.onend = () => {
      if (escuchando && !speechSynthesis.speaking) {
        try { rec.start(); } catch(e){}
      }
    };
  }

  function procesarComando(transcripcion) {
    const txt = normalizar(transcripcion);
    statusEl.innerHTML = `Escuchado: "<b>${transcripcion}</b>"`;

    if (txt.includes("apagate") || txt.includes("apagar") || txt.includes("desactivar")) {
      escuchando = false;
      estadoEstudio = "INICIO";
      rec.stop();
      hablar("Apagando sistemas, señor JP. Hasta la próxima.", () => {
        statusEl.innerHTML = "Presiona <b>ACTIVAR SISTEMA</b> para habilitar el micrófono";
        materiaBadge.innerHTML = "";
      });
      return;
    }

    if (estadoEstudio === "ESPERANDO_MATERIA") {
      let seleccionada = null;
      for (let k in MATERIAS) {
        if (MATERIAS[k].aliases.some(alias => txt.includes(alias))) {
          seleccionada = k;
          break;
        }
      }

      if (seleccionada) {
        materiaActual = seleccionada;
        estadoEstudio = "EN_EXAMEN";
        materiaBadge.innerHTML = `MATERIA: <b>${MATERIAS[materiaActual].label.toUpperCase()}</b>`;
        hablar(`Iniciando banco de ${MATERIAS[materiaActual].label}, señor JP.`, () => {
          siguientePregunta();
        });
      }
      return;
    }

    if (estadoEstudio === "EN_EXAMEN" && preguntaActual) {
      if (txt.includes("no se") || txt.includes("ni idea") || txt.includes("paso")) {
        hablar(`La respuesta correcta era ${preguntaActual.respuesta}. Pasemos a la siguiente.`, () => {
          siguientePregunta();
        });
        return;
      }

      const respCorrecta = normalizar(preguntaActual.respuesta);
      const palabrasClave = respCorrecta.split(' ').filter(p => p.length > 3);
      const acierto = txt.includes(respCorrecta) || palabrasClave.some(p => txt.includes(p));

      if (acierto) {
        hablar("Respuesta correcta, señor JP. Muy bien.", () => {
          siguientePregunta();
        });
      } else {
        hablar(`Decepcionante, señor. La respuesta era ${preguntaActual.respuesta}. Siguiente pregunta.`, () => {
          siguientePregunta();
        });
      }
    }
  }

  function siguientePregunta() {
    if (!materiaActual) return;
    const banco = MATERIAS[materiaActual].preguntas;
    const idx = Math.floor(Math.random() * banco.length);
    preguntaActual = banco[idx];
    hablar(preguntaActual.pregunta);
  }

  startBtn.addEventListener('click', () => {
    initAudioVisualizer();
    escuchando = true;
    estadoEstudio = "ESPERANDO_MATERIA";
    startBtn.disabled = true;

    const saludo = "Buenas noches, señor JP. Sistemas activos. ¿Qué materia desea estudiar hoy?";
    hablar(saludo, () => {
      try { rec.start(); } catch(e){}
    });
  });

  // Toggle Panel
  const panelToggle = document.getElementById('panelToggle');
  const panelOverlay = document.getElementById('panelOverlay');
  const cerrarPanel = document.getElementById('cerrarPanel');

  panelToggle.onclick = () => panelOverlay.classList.add('open');
  cerrarPanel.onclick = () => panelOverlay.classList.remove('open');
})();
</script>
</body>
</html>
